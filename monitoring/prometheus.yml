global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: vertep-core
    scheme: https
    tls_config:
      ca_file: /etc/vertep/tls/node-ca.crt
      insecure_skip_verify: true
    metrics_path: /metrics
    static_configs:
      - targets: ["core:8443"]
        labels:
          vertep_role: core

  - job_name: vertep-workers
    scheme: https
    tls_config:
      ca_file: /etc/vertep/tls/node-ca.crt
      insecure_skip_verify: true
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["worker"]
        type: SRV
        port: 8443
    relabel_configs:
      - source_labels: [__meta_dns_name]
        regex: (.+)
        target_label: vertep_node

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: ["log-store:3100"]
