global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # CORE is served by uvicorn over plain HTTP on port 8080 (Dockerfile CMD);
  # port 8443 belongs to the TLS reverse proxy in front of it, not to the
  # `core` container.  Worker nodes are outbound-only (Issue #80) and expose no
  # scrape endpoint, so their state is aggregated by CORE and re-exported here
  # as vertep_worker_up / vertep_workers_expected.
  - job_name: vertep-core
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets: ["core:8080"]
        labels:
          vertep_role: core

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: ["log-store:3100"]
