name: Browser E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-v2/package-lock.json
      - name: Build Angular frontend
        working-directory: web-v2
        run: |
          npm ci --silent
          npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-browser.txt
      - name: Install Playwright browsers
        run: playwright install chromium
      - name: Prepare non-secret CI configuration
        run: |
          cp .env.example .env
          printf '\nNODE_NAME=ci-worker\nCORE_ADDRESS=http://127.0.0.1:8080\nPOSTGRES_PASSWORD=ci-only\n' >> .env
      - name: Prepare browser E2E accounts
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from core.first_run import password_hash
          print("VERTEP_E2E_ADMIN_USER=e2e-admin")
          print("VERTEP_E2E_ADMIN_PASSWORD=e2e-admin-password-12")
          print("VERTEP_E2E_VIEWER_USER=e2e-viewer")
          print("VERTEP_E2E_VIEWER_PASSWORD=e2e-viewer-password-12")
          print("USERS_JSON=" + json.dumps({
              "e2e-admin": {"password_hash": password_hash("e2e-admin-password-12"), "role": "admin"},
              "e2e-viewer": {"password_hash": password_hash("e2e-viewer-password-12"), "role": "viewer"},
          }))
          PY
          # Runner не має прав на /data, тому всі виконувані каталоги живуть у
          # $RUNNER_TEMP: інакше запис профілю, пароля та system-state падає.
          echo "CONFIG_ROOT=$RUNNER_TEMP/vertep-config" >> "$GITHUB_ENV"
          echo "STORAGE_ROOT=$RUNNER_TEMP/vertep-storage" >> "$GITHUB_ENV"
          echo "JOB_ROOT=$RUNNER_TEMP/vertep-storage/jobs" >> "$GITHUB_ENV"
          echo "UPDATE_STATE_DIR=$RUNNER_TEMP/vertep-update" >> "$GITHUB_ENV"
          echo "VERTEP_E2E_STATE_DIR=$RUNNER_TEMP/vertep-update" >> "$GITHUB_ENV"
          # Значення з GITHUB_ENV доступні лише в наступних кроках, тому тут
          # каталоги створюються за $RUNNER_TEMP напряму.
          mkdir -p "$RUNNER_TEMP/vertep-config" "$RUNNER_TEMP/vertep-storage" "$RUNNER_TEMP/vertep-update"
          printf '{}' > "$RUNNER_TEMP/vertep-config/users.json"
          printf '{"completed_at": "2024-01-01T00:00:00Z"}' > "$RUNNER_TEMP/vertep-config/installation.json"
      - name: Start Backup service for the real backup chain
        run: |
          export BACKUP_ROOT="$RUNNER_TEMP/vertep-backups"
          export BACKUP_SOURCES="config:$RUNNER_TEMP/vertep-config"
          export BACKUP_ENCRYPTION_KEY="$(openssl rand -hex 32)"
          export BACKUP_PG_DUMP_CMD=""
          export BACKUP_REDIS_DUMP_CMD=""
          mkdir -p "$BACKUP_ROOT"
          nohup python -m uvicorn services.backup_service:app --host 127.0.0.1 --port 8090 \
            > "$RUNNER_TEMP/vertep-backup.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/health >/dev/null 2>&1; then
              echo "Backup service is up"
              echo "BACKUP_URL=http://127.0.0.1:8090" >> "$GITHUB_ENV"
              echo "VERTEP_E2E_BACKUP_SMOKE=1" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "Backup service did not start" >&2
          cat "$RUNNER_TEMP/vertep-backup.log" >&2
          exit 1
      - name: Start CORE for smoke tests
        env:
          RATE_LIMIT_PER_MINUTE: "100000"
          SETUP_RATE_LIMIT_PER_10_MINUTES: "100000"
        run: |
          # Лог у файл, а не в pipe кроку: інакше процес гине разом із кроком
          # на першому ж записі після його завершення.
          nohup python -m uvicorn core.app:app --host 127.0.0.1 --port 8080 \
            > "$RUNNER_TEMP/vertep-core.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1; then
              echo "CORE is up"
              exit 0
            fi
            sleep 1
          done
          echo "CORE did not start in time" >&2
          cat "$RUNNER_TEMP/vertep-core.log" >&2
          exit 1
      - name: Verify CORE E2E preconditions
        run: |
          set -euo pipefail
          basic() { printf '%s' "$1:$2" | base64 -w0; }
          admin_auth=$(basic "$VERTEP_E2E_ADMIN_USER" "$VERTEP_E2E_ADMIN_PASSWORD")
          viewer_auth=$(basic "$VERTEP_E2E_VIEWER_USER" "$VERTEP_E2E_VIEWER_PASSWORD")
          for auth in "$admin_auth" "$viewer_auth"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/api/session \
              -H "Authorization: Basic $auth")
            if [ "$code" != "200" ]; then
              echo "E2E account cannot sign in: HTTP $code" >&2
              cat "$RUNNER_TEMP/vertep-core.log" >&2
              exit 1
            fi
          done
          printf '{"state": "READ_ONLY", "updated_at": "2026-01-01T00:00:00+00:00", "reason": "e2e preflight", "operation_id": null}' \
            > "$VERTEP_E2E_STATE_DIR/system-state.json"
          state=$(curl -fsS http://127.0.0.1:8080/api/status -H "Authorization: Basic $admin_auth" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["system"]["state"])')
          printf '{"state": "NORMAL", "updated_at": "2026-01-01T00:00:00+00:00", "reason": "", "operation_id": null}' \
            > "$VERTEP_E2E_STATE_DIR/system-state.json"
          if [ "$state" != "READ_ONLY" ]; then
            echo "CORE does not observe $VERTEP_E2E_STATE_DIR (system state is $state)" >&2
            cat "$RUNNER_TEMP/vertep-core.log" >&2
            exit 1
          fi
          echo "E2E preconditions verified"
      - name: Run browser E2E smoke tests
        run: python -m pytest tests/test_browser_e2e.py -q
      - name: Run Update Center real-backend browser acceptance
        env:
          VERTEP_REQUIRE_UPDATE_BROWSER_E2E: "1"
        run: python -m pytest -q tests/test_update_browser_e2e.py
      - name: Run media review real-backend browser acceptance
        env:
          VERTEP_REQUIRE_MEDIA_BROWSER_E2E: "1"
        run: python -m pytest -q tests/test_media_browser_e2e.py

  lab-web-e2e:
    # Issue #251: the Lab panel must be proven as its own Angular build against
    # the real Lab API, and as a self-contained image. Skips are not a PASS.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VERTEP_REQUIRE_LAB_WEB_E2E: "1"
      VERTEP_REQUIRE_LAB_WEB_DOCKER_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: deploy/lab/web/app/package-lock.json
      - name: Build Lab Angular panel
        working-directory: deploy/lab/web/app
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-browser.txt
      - name: Install Playwright browsers
        run: playwright install --with-deps chromium
      - name: Run Lab panel Browser+CLI acceptance
        run: python -m pytest -q tests/test_lab_web_e2e.py
      - name: Validate Lab compose configuration
        run: docker compose -f deploy/lab/docker-compose.web.yml config --quiet
      - name: Run Lab Web Docker proof
        run: python -m pytest -q tests/test_lab_web_docker.py
