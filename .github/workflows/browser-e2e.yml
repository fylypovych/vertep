name: Browser E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-browser.txt
      - name: Install Playwright browsers
        run: playwright install chromium
      - name: Prepare non-secret CI configuration
        run: |
          cp .env.example .env
          printf '\nNODE_NAME=ci-worker\nCORE_ADDRESS=http://127.0.0.1:8080\nPOSTGRES_PASSWORD=ci-only\n' >> .env
      - name: Start CORE for smoke tests
        run: |
          python -m uvicorn core.app:app --host 127.0.0.1 --port 8080 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1; then
              echo "CORE is up"
              exit 0
            fi
            sleep 1
          done
          echo "CORE did not start in time" >&2
          exit 1
      - name: Run browser E2E smoke tests
        run: python -m pytest tests/test_browser_e2e.py -q
