name: Browser E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-v2/package-lock.json
      - name: Build Angular frontend
        working-directory: web-v2
        run: |
          npm ci --silent
          npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-browser.txt
      - name: Install Playwright browsers
        run: playwright install chromium
      - name: Prepare non-secret CI configuration
        run: |
          cp .env.example .env
          printf '\nNODE_NAME=ci-worker\nCORE_ADDRESS=http://127.0.0.1:8080\nPOSTGRES_PASSWORD=ci-only\n' >> .env
      - name: Prepare browser E2E accounts
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from core.first_run import password_hash
          print("VERTEP_E2E_ADMIN_USER=e2e-admin")
          print("VERTEP_E2E_ADMIN_PASSWORD=e2e-admin-password-12")
          print("VERTEP_E2E_VIEWER_USER=e2e-viewer")
          print("VERTEP_E2E_VIEWER_PASSWORD=e2e-viewer-password-12")
          print("USERS_JSON=" + json.dumps({
              "e2e-admin": {"password_hash": password_hash("e2e-admin-password-12"), "role": "admin"},
              "e2e-viewer": {"password_hash": password_hash("e2e-viewer-password-12"), "role": "viewer"},
          }))
          PY
          # Runner не має прав на /data, тому всі виконувані каталоги живуть у
          # $RUNNER_TEMP: інакше запис профілю, пароля та system-state падає.
          echo "CONFIG_ROOT=$RUNNER_TEMP/vertep-config" >> "$GITHUB_ENV"
          echo "STORAGE_ROOT=$RUNNER_TEMP/vertep-storage" >> "$GITHUB_ENV"
          echo "JOB_ROOT=$RUNNER_TEMP/vertep-storage/jobs" >> "$GITHUB_ENV"
          echo "UPDATE_STATE_DIR=$RUNNER_TEMP/vertep-update" >> "$GITHUB_ENV"
          echo "VERTEP_E2E_STATE_DIR=$RUNNER_TEMP/vertep-update" >> "$GITHUB_ENV"
          # Значення з GITHUB_ENV доступні лише в наступних кроках, тому тут
          # каталоги створюються за $RUNNER_TEMP напряму.
          mkdir -p "$RUNNER_TEMP/vertep-config" "$RUNNER_TEMP/vertep-storage" "$RUNNER_TEMP/vertep-update"
          printf '{}' > "$RUNNER_TEMP/vertep-config/users.json"
          printf '{"completed_at": "2024-01-01T00:00:00Z"}' > "$RUNNER_TEMP/vertep-config/installation.json"
      - name: Start CORE for smoke tests
        env:
          RATE_LIMIT_PER_MINUTE: "100000"
          SETUP_RATE_LIMIT_PER_10_MINUTES: "100000"
        run: |
          # Лог у файл, а не в pipe кроку: інакше процес гине разом із кроком
          # на першому ж записі після його завершення.
          nohup python -m uvicorn core.app:app --host 127.0.0.1 --port 8080 \
            > "$RUNNER_TEMP/vertep-core.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1; then
              echo "CORE is up"
              exit 0
            fi
            sleep 1
          done
          echo "CORE did not start in time" >&2
          cat "$RUNNER_TEMP/vertep-core.log" >&2
          exit 1
      - name: Verify CORE E2E preconditions
        run: |
          set -euo pipefail
          basic() { printf '%s' "$1:$2" | base64 -w0; }
          for pair in "e2e-admin:e2e-admin-password-12" "e2e-viewer:e2e-viewer-password-12"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/api/session \
              -H "Authorization: Basic $(basic "${pair%%:*}" "${pair##*:}")")
            if [ "$code" != "200" ]; then
              echo "E2E account ${pair%%:*} cannot sign in: HTTP $code" >&2
              cat "$RUNNER_TEMP/vertep-core.log" >&2
              exit 1
            fi
          done
          printf '{"state": "READ_ONLY", "updated_at": "2026-01-01T00:00:00+00:00", "reason": "e2e preflight", "operation_id": null}' \
            > "$VERTEP_E2E_STATE_DIR/system-state.json"
          state=$(curl -fsS http://127.0.0.1:8080/api/status | python -c 'import json,sys; print(json.load(sys.stdin)["system"]["state"])')
          printf '{"state": "NORMAL", "updated_at": "2026-01-01T00:00:00+00:00", "reason": "", "operation_id": null}' \
            > "$VERTEP_E2E_STATE_DIR/system-state.json"
          if [ "$state" != "READ_ONLY" ]; then
            echo "CORE does not observe $VERTEP_E2E_STATE_DIR (system state is $state)" >&2
            cat "$RUNNER_TEMP/vertep-core.log" >&2
            exit 1
          fi
          echo "E2E preconditions verified"
      - name: Run browser E2E smoke tests
        run: python -m pytest tests/test_browser_e2e.py -q
