name: Component releases

# #510 (VAR #509): independent, signed releases of changed official components.
# Every push to main is classified by scripts/component-release.py impact: the changed
# component's tests, compatibility with supported CORE and install/update/rollback run;
# a shared contract pulls in every dependent component; an unknown impact runs the full
# suite. Only after the required tests pass are changed modules published as stable
# signed releases tagged <component>.<version>. Publication stays off until the owner
# sets the repository variable COMPONENT_RELEASES_ENABLED=true (AGENTS.md §2.13).
# CORE itself keeps the shared VERSION and the existing «реліз» runtime release.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: 'Base commit for the impact (empty: the previous commit)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: component-releases
  cancel-in-progress: false

jobs:
  impact:
    runs-on: ubuntu-24.04
    outputs:
      full_suite: ${{ steps.impact.outputs.full_suite }}
      components: ${{ steps.impact.outputs.components }}
      tests: ${{ steps.impact.outputs.tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pyyaml
      - name: Classify the change
        id: impact
        env:
          BASE: ${{ inputs.base || github.event.before }}
        run: |
          set -euo pipefail
          base="${BASE:-}"
          [ -n "$base" ] || base="$(git rev-parse HEAD~1 2>/dev/null || true)"
          python scripts/component-release.py impact --base "$base" --head "$GITHUB_SHA" > impact.json
          cat impact.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          impact = json.load(open("impact.json"))
          print("full_suite=" + ("true" if impact["full_suite"] else "false"))
          print("components=" + ",".join(impact["components"]))
          print("tests=" + " ".join(impact["tests"]))
          PY

  tests:
    needs: impact
    if: needs.impact.outputs.full_suite == 'true' || needs.impact.outputs.components != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Required tests for this change
        env:
          FULL: ${{ needs.impact.outputs.full_suite }}
          TESTS: ${{ needs.impact.outputs.tests }}
        run: |
          set -euo pipefail
          if [ "$FULL" = "true" ]; then
            python -m pytest -q -n 8 --dist loadgroup \
              --ignore=tests/test_standard_host_consumer_docker.py \
              --ignore=tests/test_standard_core_consumer_docker.py \
              --ignore=tests/test_browser_e2e.py
          else
            # shellcheck disable=SC2086
            python -m pytest -q -n 4 --dist loadgroup $TESTS
          fi

  publish:
    needs: [impact, tests]
    if: vars.COMPONENT_RELEASES_ENABLED == 'true' && needs.impact.outputs.components != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pyyaml cryptography
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Plan versions (collisions, forward-only, images, backfill of packageless releases)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPONENTS: ${{ needs.impact.outputs.components }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '[.[] | {tag: .tag_name, assets: [.assets[].name]}]' | jq -s 'add' > releases.json
          python scripts/component-release.py plan --components "$COMPONENTS" --sha "$GITHUB_SHA" \
            --releases releases.json | tee plan.json
          python - <<'PY'
          import json
          plan = json.load(open("plan.json"))
          errors = {name: entry["error"] for name, entry in plan.items() if "error" in entry}
          # A refused component (e.g. changed without a new version) no longer blocks the others;
          # the job still fails at the end so the refusal is visible.
          open("refused.json", "w").write(json.dumps(errors))
          if errors:
              print("::error::Component release refused:", errors)
          PY
      - name: Build images, sign packages and publish stable component releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.RUNTIME_SIGNING_PRIVATE_KEY }}
          MODULE_SIGNING_KEY: ${{ secrets.MODULE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key="${RUNNER_TEMP}/component-signing.pem"
          module_key="${RUNNER_TEMP}/module-signing.pem"
          printf '%s' "$SIGNING_KEY" > "$key"
          printf '%s' "$MODULE_SIGNING_KEY" > "$module_key"
          chmod 600 "$key" "$module_key"
          trap 'rm -f "$key" "$module_key"' EXIT
          # Annotated tags need a committer identity on the runner.
          git config user.name "vertep-release[bot]"
          git config user.email "vertep-release[bot]@users.noreply.github.com"
          field() { python -c "import json,sys; e=json.load(open('plan.json'))['$1']; v=e; [v:=v.get(k) if isinstance(v,dict) else None for k in sys.argv[1:]]; print(v if v is not None else '')" "${@:2}"; }
          for component in $(python -c 'import json; print(" ".join(n for n, e in json.load(open("plan.json")).items() if e["publish"] or e.get("backfill")))'); do
            tag="$(field "$component" tag)"
            version="$(field "$component" version)"
            commit="$(field "$component" commit)"; commit="${commit:-$GITHUB_SHA}"
            out="${RUNNER_TEMP}/${tag}"
            mkdir -p "$out"
            assets=()
            manifest_args=()
            image_name="$(field "$component" image name)"
            if [ -n "$image_name" ]; then
              # The module's own container, pinned by digest inside its signed package.
              ref="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${image_name}"
              docker buildx build --platform linux/amd64,linux/arm64 --push \
                --tag "${ref}:component-${version}" \
                --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
                --metadata-file "${out}/image.json" \
                --file "$(field "$component" image file)" "$(field "$component" image context)"
              digest="$(jq -r '."containerimage.digest"' "${out}/image.json")"
              python scripts/component-release.py package --component "$component" --private-key "$module_key" \
                --image "${ref}@${digest}" --output "${out}/package.json"
              assets+=("${out}/package.json" "${out}/package.json.sha256")
              manifest_args+=(--image "$digest" --artifact "package.json=${out}/package.json")
            fi
            python scripts/component-release.py manifest --component "$component" --sha "$commit" \
              --private-key "$key" --output "${out}/${tag}.manifest.json" "${manifest_args[@]}"
            if [ "$(field "$component" backfill)" = "True" ]; then
              # A release published before packages existed gets its package (same component files).
              gh release upload "$tag" "${out}/${tag}.manifest.json" "${assets[@]}" --clobber
            else
              git tag -a "$tag" "$GITHUB_SHA" -m "Vertep component $tag"
              git push origin "refs/tags/$tag"
              # Never "latest": bootstrap and the update agent resolve the runtime from releases/latest.
              gh release create "$tag" "${out}/${tag}.manifest.json" "${assets[@]}" --title "$tag" \
                --notes "Stable signed component release $tag" --verify-tag --latest=false
            fi
          done
          if [ "$(cat refused.json)" != "{}" ]; then
            echo "Refused components: $(cat refused.json)"
            exit 1
          fi
