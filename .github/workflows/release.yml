name: Vertep Release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: vertep-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate and determine release number
        id: version
        shell: bash
        run: |
          python -m compileall -q core adapters worker scripts installer tests
          python -m pytest -q
          version="$(python scripts/release.py --show-next)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-images:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {name: core, file: Dockerfile, platforms: "linux/amd64,linux/arm64"}
          - {name: tts, file: docker/tts/Dockerfile, platforms: "linux/amd64,linux/arm64"}
          - {name: publisher-worker, file: docker/publisher/Dockerfile, platforms: "linux/amd64,linux/arm64"}
          - {name: backup-service, file: docker/backup/Dockerfile, platforms: "linux/amd64,linux/arm64"}
          - {name: proxy, file: docker/proxy/Dockerfile, platforms: "linux/amd64,linux/arm64"}
          - {name: postgres, file: docker/postgres/Dockerfile, platforms: "linux/amd64,linux/arm64"}
          - {name: redis, file: docker/redis/Dockerfile, platforms: "linux/amd64,linux/arm64"}
          - {name: ollama, file: docker/ollama/Dockerfile, platforms: "linux/amd64,linux/arm64"}
          - {name: monitoring, file: docker/monitoring/Dockerfile, platforms: "linux/amd64,linux/arm64"}
          - {name: log-store, file: docker/log-store/Dockerfile, platforms: "linux/amd64,linux/arm64"}
          - {name: log-collector, file: docker/log-collector/Dockerfile, platforms: "linux/amd64,linux/arm64"}
          - {name: grafana, file: docker/grafana/Dockerfile, platforms: "linux/amd64,linux/arm64"}
          - {name: comfyui, file: docker/comfyui-nvidia/Dockerfile, platforms: "linux/amd64"}
          - {name: comfyui-amd, file: docker/comfyui-amd/Dockerfile, platforms: "linux/amd64"}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: true
          build-args: VERTEP_VERSION=${{ needs.prepare.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/vertep-${{ matrix.name }}:${{ needs.prepare.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/vertep-${{ matrix.name }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Save immutable image metadata
        shell: bash
        run: |
          mkdir image-metadata
          jq -n \
            --arg name '${{ matrix.name }}' \
            --arg reference 'ghcr.io/${{ github.repository_owner }}/vertep-${{ matrix.name }}:${{ needs.prepare.outputs.version }}' \
            --arg digest '${{ steps.build.outputs.digest }}' \
            --arg platforms '${{ matrix.platforms }}' \
            '{name:$name,reference:$reference,digest:$digest,platforms:($platforms|split(","))}' \
            > "image-metadata/${{ matrix.name }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.name }}
          path: image-metadata/*.json
          retention-days: 1

  publish-release:
    needs: [prepare, build-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: ${{ runner.temp }}/image-metadata
          merge-multiple: true
      - name: Make GHCR packages publicly pullable
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for package in core tts publisher-worker backup-service proxy postgres redis ollama monitoring log-store log-collector grafana comfyui comfyui-amd; do
            gh api --method PATCH "/user/packages/container/vertep-$package" -f visibility=public >/dev/null
          done
      - name: Create signed runtime release
        shell: bash
        env:
          RUNTIME_SIGNING_PRIVATE_KEY: ${{ secrets.RUNTIME_SIGNING_PRIVATE_KEY }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git config user.name "vertep-release[bot]"
          git config user.email "vertep-release[bot]@users.noreply.github.com"
          python scripts/release.py --no-push --skip-tests
          version="$(tr -d '\r\n' < VERSION)"
          test "$version" = "$EXPECTED_VERSION"
          python scripts/assemble-image-lock.py "${{ runner.temp }}/image-metadata" "${{ runner.temp }}/images.json"
          printf '%s' "$RUNTIME_SIGNING_PRIVATE_KEY" > "${{ runner.temp }}/runtime-signing.pem"
          chmod 600 "${{ runner.temp }}/runtime-signing.pem"
          sequence="$(python -c 'p=list(map(int,open("VERSION").read().strip().split("."))); print(((p[0]*100+p[1])*100+p[2])*100+p[3])')"
          python scripts/build-runtime-bundle.py \
            --root . \
            --output "${{ runner.temp }}/runtime" \
            --version "$version" \
            --sequence "$sequence" \
            --image-lock "${{ runner.temp }}/images.json" \
            --private-key "${{ runner.temp }}/runtime-signing.pem"
          python scripts/runtime-contract.py validate \
            "${{ runner.temp }}/runtime/manifest.json" \
            --artifact-root "${{ runner.temp }}/runtime" \
            --public-key installer/update-public.pem
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "${{ runner.temp }}/vertep-runtime-$version.tar.gz" \
            -C "${{ runner.temp }}/runtime" .
          cp "${{ runner.temp }}/runtime/manifest.json" "${{ runner.temp }}/manifest-$version.json"
          cd "${{ runner.temp }}"
          sha256sum "vertep-runtime-$version.tar.gz" "manifest-$version.json" > "SHA256SUMS-$version"
      - name: Push numbered commit and tag
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          git push --atomic origin HEAD:main "$version"
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          gh release create "$version" \
            --title "Vertep $version" \
            --notes-file "releases/$version.md" \
            "${{ runner.temp }}/vertep-runtime-$version.tar.gz" \
            "${{ runner.temp }}/manifest-$version.json" \
            "${{ runner.temp }}/SHA256SUMS-$version"
