name: Create sequential release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vertep-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Configure release identity
        run: |
          git config user.name "vertep-release[bot]"
          git config user.email "vertep-release[bot]@users.noreply.github.com"
      - name: Generate, validate and push next release
        run: python scripts/release.py
