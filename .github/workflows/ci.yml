name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare non-secret CI configuration
        run: |
          cp .env.example .env
          printf '\nNODE_NAME=ci-worker\nCORE_ADDRESS=http://127.0.0.1:8080\nPOSTGRES_PASSWORD=ci-only\n' >> .env
          cp .env deploy/.env
          cp -r monitoring deploy/monitoring
          printf 'ci-only-secret-store-passphrase' > config/secret-store.passphrase
      - name: Compile Python sources
        run: python -m compileall -q core adapters worker telegram publishers scripts tests
      - name: Run test suite
        run: python -m pytest -q
      - name: Validate shell syntax
        run: bash -n bootstrap.sh install.sh installer/*.sh scripts/vertep scripts/restore.sh
      - name: Validate Compose configurations
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.worker.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
          docker compose --env-file .env -f deploy/docker-compose.yml config --quiet
      - name: Build role runtime images
        run: |
          docker build -f docker/tts/Dockerfile -t vertep/tts:ci .
          docker build -f docker/publisher/Dockerfile -t vertep/publisher:ci .
          docker build -f docker/backup/Dockerfile -t vertep/backup:ci .
      - name: Validate monitoring configuration
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /usr/bin/loki \
            -v "$PWD/monitoring/loki.yml:/etc/loki/config.yml:ro" grafana/loki:3.5.2 \
            -verify-config=true -config.file=/etc/loki/config.yml
          docker run --rm --entrypoint /usr/bin/promtail \
            -v "$PWD/monitoring/promtail.yml:/etc/promtail/config.yml:ro" grafana/promtail:3.5.2 \
            -check-syntax -config.file=/etc/promtail/config.yml -config.expand-env=true
      - name: Run appliance release qualification gates
        run: python scripts/qualify-release.py --root . --docker --output qualification.json
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appliance-qualification
          path: qualification.json
          if-no-files-found: error
