name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare non-secret CI configuration
        run: |
          cp .env.example .env
          printf '\nNODE_NAME=ci-worker\nCORE_ADDRESS=http://127.0.0.1:8080\nPOSTGRES_PASSWORD=ci-only\n' >> .env
      - name: Compile Python sources
        run: python -m compileall -q core adapters worker telegram publishers scripts tests
      - name: Run test suite
        run: python -m pytest -q
      - name: Validate shell syntax
        run: bash -n install.sh installer/*.sh scripts/vertep
      - name: Validate Compose configurations
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.worker.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
