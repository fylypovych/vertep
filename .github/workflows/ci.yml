name: CI

on:
  push:
  pull_request:
  # A «пуш» commit carries [skip ci]; «реліз» dispatches CI for that exact SHA (AGENTS.md §2.10).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu-built-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Встановлення залежностей acceptance tests
        run: python -m pip install -r requirements.txt
      - name: Pinned GPU image, inventory delivery, readiness та media trace
        env:
          VERTEP_REQUIRE_GPU_BUILT_INVENTORY: "1"
        run: >-
          python -m pytest -q tests/test_gpu_built_inventory.py
          tests/test_gpu_runtime_inventory_delivery.py tests/test_gpu_http_pipeline.py
          tests/test_gpu_media_fixtures.py tests/test_comfyui_runtime_inventory.py
          -o junit_family=legacy --junitxml=${{ runner.temp }}/gpu-inventory.xml
          --basetemp=${{ runner.temp }}/gpu-inventory
      - name: Збереження image identity та actual inventory evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gpu-inventory-${{ github.sha }}
          path: |
            ${{ runner.temp }}/gpu-inventory.xml
            ${{ runner.temp }}/gpu-inventory/**/gpu-build.log
            ${{ runner.temp }}/gpu-inventory/**/gpu-built-evidence.json

  runtime-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and execute the standard runtime identity probe
        run: python scripts/verify-runtime-identity.py --evidence runtime-identity-evidence.json
      - name: Upload runtime identity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-identity
          path: runtime-identity-evidence.json
          if-no-files-found: error

  local-contracts:
    runs-on: ubuntu-24.04
    # The suite also runs the Docker-backed standard consumer tests (~16 min before #393).
    # workflow_dispatch adds the serial run for #439.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 150 || 45 }}
    env:
      VERTEP_STREAM_FAILURES: "1"
      VERTEP_TEST_REDIS_URL: redis://localhost:6379/0
      VERTEP_REQUIRE_PKI_CALLER_ACCEPTANCE: "1"
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Install redis-server for queue persistence tests
        run: |
          if [ -f /usr/sbin/policy-rc.d ]; then sudo cp /usr/sbin/policy-rc.d /usr/sbin/policy-rc.d.bak; fi
          printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d > /dev/null
          sudo chmod +x /usr/sbin/policy-rc.d
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq redis-server
          if [ -f /usr/sbin/policy-rc.d.bak ]; then sudo mv /usr/sbin/policy-rc.d.bak /usr/sbin/policy-rc.d; else sudo rm -f /usr/sbin/policy-rc.d; fi
          redis-server --version
      - name: Prepare non-secret CI configuration
        run: |
          cp .env.example .env
          printf '\nNODE_NAME=ci-worker\nCORE_ADDRESS=http://127.0.0.1:8080\nPOSTGRES_PASSWORD=ci-only\n' >> .env
          cp .env deploy/.env
          cp -r monitoring deploy/monitoring
          printf 'ci-only-secret-store-passphrase' > config/secret-store.passphrase
      - name: Compile Python sources
        run: python -m compileall -q core adapters worker telegram publishers scripts lab tests
      - name: Audit signals sent on the host
        # The runner was shut down mid-run with no failed test: keep who signalled what.
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq auditd
          sudo auditctl -a always,exit -F arch=b64 -S kill -S tkill -S tgkill -k vertep_signal
      - name: Run test suite
        run: |
          openssl version
          ( sudo tail -n0 -F /var/log/audit/audit.log | grep --line-buffered 'key="vertep_signal"' | sed -u 's/^/[signal] /' ) &
          ( while true; do echo "[resources] $(date -u +%T) $(free -m | awk '/Mem:/{print "mem_used="$3"MB avail="$7"MB"}') $(df -h / | awk 'NR==2{print "disk_avail="$4}')"; sleep 15; done ) &
          # The Docker-backed standard consumer tests are required in fleet-persistence-runtime-acceptance;
          # running them here too doubled the job time past its limit.
          # Three runners were shut down right at these cancel/kill tests: they run in fleet-cancel-path.
          python -m pytest -v -n 2 --dist loadgroup --ignore=tests/test_core_rollout_coordinator.py -o junit_family=legacy -o faulthandler_timeout=600 --junitxml="$RUNNER_TEMP/local-contracts.xml" --basetemp="$RUNNER_TEMP/local-contracts"             --ignore=tests/test_standard_host_consumer_docker.py --ignore=tests/test_standard_core_consumer_docker.py
      - name: Збереження exact-SHA process та trust acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-contracts-${{ github.sha }}
          path: |
            ${{ runner.temp }}/local-contracts.xml
            ${{ runner.temp }}/local-contracts/**/backup-process-*.log
      - name: Validate shell syntax
        run: bash -n bootstrap.sh install.sh installer/*.sh scripts/vertep scripts/restore.sh
      - name: Послідовний прогін і порівняння з паралельним (#439)
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        run: |
          python -m pytest -q -p no:xdist --ignore=tests/test_core_rollout_coordinator.py -o junit_family=legacy -o faulthandler_timeout=600 --junitxml="$RUNNER_TEMP/local-contracts-serial.xml" --basetemp="$RUNNER_TEMP/local-contracts-serial" --ignore=tests/test_standard_host_consumer_docker.py --ignore=tests/test_standard_core_consumer_docker.py || true
          python scripts/compare_junit.py "$RUNNER_TEMP/local-contracts.xml" "$RUNNER_TEMP/local-contracts-serial.xml"
      - name: Validate Compose configurations
        run: |
          docker compose -f docker-compose.yml config --quiet
          VERTEP_VERSION=$(cat VERSION) docker compose -f docker-compose.yml -f docker-compose.moneyprinter.yml --profile moneyprinter config --quiet
          docker compose -f docker-compose.worker.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
          docker compose --env-file .env -f deploy/docker-compose.yml config --quiet
      - name: Build role runtime images
        run: |
          docker build -f docker/tts/Dockerfile -t vertep/tts:ci .
          docker build -f docker/publisher/Dockerfile -t vertep/publisher:ci .
          docker build -f docker/backup/Dockerfile -t vertep/backup:ci .
      - name: Validate monitoring configuration
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /usr/bin/loki \
            -v "$PWD/monitoring/loki.yml:/etc/loki/config.yml:ro" grafana/loki:3.5.2 \
            -verify-config=true -config.file=/etc/loki/config.yml
          docker run --rm --entrypoint /usr/bin/promtail \
            -v "$PWD/monitoring/promtail.yml:/etc/promtail/config.yml:ro" grafana/promtail:3.5.2 \
            -check-syntax -config.file=/etc/promtail/config.yml -config.expand-env=true
      - name: Run appliance release qualification gates
        run: python scripts/qualify-release.py --root . --docker --output qualification.json
      - name: Verify the pinned MoneyPrinterTurbo runtime once
        run: |
          python scripts/moneyprinter-runtime-check.py \
            --timeout 900 --evidence moneyprinter-runtime-evidence
      - name: Upload MoneyPrinterTurbo runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: moneyprinter-runtime-check
          path: moneyprinter-runtime-evidence
          if-no-files-found: warn
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appliance-qualification
          path: qualification.json
          if-no-files-found: warn

  postgres-backfill:
    # Issue #135: the backfill/lifecycle evidence must run against a real,
    # disposable PostgreSQL — a skipped integration test is not a PASS.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERTEP_TEST_DATABASE_URL: postgresql://vertep:ci-only@localhost:5432/vertep
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vertep
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: vertep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vertep"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run PostgreSQL backfill integration and unit tests
        run: python -m pytest -q tests/test_issue_412_postgres_real.py tests/test_backfill_postgres.py tests/test_backfill.py tests/test_persistent_user_data.py tests/test_workflow_postgres_state.py

  fleet-persistence-runtime-acceptance:
    # #378/#379: these two remaining boundaries need a real PostgreSQL epoch,
    # Linux process groups and Docker-backed healthy CORE dependencies.  They
    # are fail-closed rather than local skips.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERTEP_STREAM_FAILURES: "1"
      VERTEP_REQUIRE_DISTRIBUTED_UPDATE_FENCE: "1"
      VERTEP_UPDATE_LEASE_DATABASE_URL: postgresql://vertep:ci-only@localhost:5432/vertep
      VERTEP_REQUIRE_CONNECTED_RESTORE: "1"
      VERTEP_REQUIRE_STANDARD_HOST_CONSUMER: "1"
      VERTEP_CONNECTED_RESTORE_DATABASE_URL: postgresql://vertep:ci-only@localhost:5432/vertep
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vertep
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: vertep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vertep"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Free disk space for the Vertep images
        # Every fleet test pulls full Vertep images; a full disk kills the hosted runner
        # ("runner received a shutdown signal") before JUnit is written (#396).
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / /var/lib/docker
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-browser.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-v2/package-lock.json
      - name: Build Angular frontend for the Browser restore (#401 P3)
        working-directory: web-v2
        run: |
          npm ci --silent
          npm run build
      - name: Resolve the Playwright version
        id: playwright-version
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium
      - name: Run actual PostgreSQL fencing and connected healthy restore
        env:
          VERTEP_REQUIRE_BACKUP_BROWSER_E2E: "1"
          VERTEP_REQUIRE_UPDATE_BROWSER_E2E: "1"
        run: |
          # #396: the runner was shut down mid-run twice; sample memory/disk so the log
          # keeps the cause even when the job dies before the summary.
          ( while true; do echo "[resources] $(date -u +%T) $(free -m | awk '/Mem:/{print "mem_used="$3"MB avail="$7"MB"}') $(df -h / | awk 'NR==2{print "disk_used="$5" free="$4}')"; sleep 15; done ) &
          python -m pytest -v --durations=25 -o junit_family=legacy -o faulthandler_timeout=600             --junitxml="$RUNNER_TEMP/fleet-persistence-runtime.xml"             --basetemp="$RUNNER_TEMP/fleet-persistence-runtime"             tests/test_core_rollout_coordinator.py::test_postgres_epoch_takeover_stops_active_host_apply             tests/test_backup_process_acceptance.py::test_connected_healthy_restore_returns_normal_after_core_restart             tests/test_backup_process_acceptance.py::test_core_reads_back_a_restored_workflow_after_a_backup_service_restore             tests/test_backup_process_acceptance.py::test_telegram_restore_completes_with_a_terminal_success_on_healthy_dependencies             tests/test_backup_restore_browser_e2e.py             tests/test_update_standard_browser_e2e.py             tests/test_standard_host_consumer_docker.py             tests/test_standard_core_consumer_docker.py --deselect tests/test_standard_host_consumer_docker.py::test_workers_first_rollout_times_out_on_core_rolls_the_worker_back_and_a_retry_succeeds --deselect tests/test_standard_host_consumer_docker.py::test_standard_consumer_moves_a_running_vertep_worker_and_core_observes_it --deselect tests/test_standard_host_consumer_docker.py::test_a_rollout_to_an_offline_node_fails_instead_of_hanging --deselect tests/test_standard_host_consumer_docker.py::test_core_drives_a_canary_rollout_and_holds_it_for_promotion --deselect tests/test_standard_host_consumer_docker.py::test_rollback_restores_previous_version_and_ready_state --deselect tests/test_standard_host_consumer_docker.py::test_standard_consumer_updates_restarts_and_rolls_back_a_running_worker --deselect tests/test_standard_host_consumer_docker.py::test_standard_consumer_drains_and_admits_workers_during_update --deselect tests/test_standard_host_consumer_docker.py::test_interruption_during_apply_does_not_overwrite_newer_data --deselect tests/test_standard_host_consumer_docker.py::test_retry_does_not_return_deleted_seeds --deselect tests/test_standard_host_consumer_docker.py::test_cancel_during_an_active_standard_apply_kills_it_without_a_delayed_effect --deselect tests/test_standard_host_consumer_docker.py::test_losing_the_lease_database_kills_the_active_apply_and_a_retry_succeeds_after_restart
      - name: Disk usage after the fleet tests
        if: always()
        run: df -h / /var/lib/docker && docker system df
      - name: Criterion report from this run's JUnit (#396 P5)
        if: always()
        run: >-
          python scripts/report_criterion_390.py --run-sha "$GITHUB_SHA"
          --junit "$RUNNER_TEMP/fleet-persistence-runtime.xml"
          --output "$RUNNER_TEMP/criterion-390.json"
      - name: Upload fleet and connected restore evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fleet-persistence-runtime-${{ github.sha }}
          path: |
            ${{ runner.temp }}/fleet-persistence-runtime.xml
            ${{ runner.temp }}/criterion-390.json
            ${{ runner.temp }}/fleet-persistence-runtime/**/backup-process-*.log
          if-no-files-found: error

  fleet-rollout-acceptance:
    # Rollout half of the fleet matrix, apart so both halves finish sooner. The same
    # tests and the same fail-closed settings as fleet-persistence-runtime-acceptance.
    # Two parts of near-equal length: the workers-first test alone takes about 5 minutes.
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: workers-first
            tests: tests/test_standard_host_consumer_docker.py::test_workers_first_rollout_times_out_on_core_rolls_the_worker_back_and_a_retry_succeeds
          - part: consumer
            tests: tests/test_standard_host_consumer_docker.py::test_standard_consumer_moves_a_running_vertep_worker_and_core_observes_it tests/test_standard_host_consumer_docker.py::test_a_rollout_to_an_offline_node_fails_instead_of_hanging tests/test_standard_host_consumer_docker.py::test_core_drives_a_canary_rollout_and_holds_it_for_promotion tests/test_standard_host_consumer_docker.py::test_rollback_restores_previous_version_and_ready_state tests/test_standard_host_consumer_docker.py::test_standard_consumer_updates_restarts_and_rolls_back_a_running_worker tests/test_standard_host_consumer_docker.py::test_standard_consumer_drains_and_admits_workers_during_update
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERTEP_STREAM_FAILURES: "1"
      VERTEP_REQUIRE_DISTRIBUTED_UPDATE_FENCE: "1"
      VERTEP_UPDATE_LEASE_DATABASE_URL: postgresql://vertep:ci-only@localhost:5432/vertep
      VERTEP_REQUIRE_STANDARD_HOST_CONSUMER: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vertep
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: vertep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vertep"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Free disk space for the Vertep images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / /var/lib/docker
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the rollout half of the fleet matrix
        run: >-
          python -m pytest -v --durations=25 -o junit_family=legacy -o faulthandler_timeout=600
          --junitxml="$RUNNER_TEMP/fleet-rollout.xml"
          --basetemp="$RUNNER_TEMP/fleet-rollout"
          ${{ matrix.tests }}
      - name: Upload fleet rollout evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fleet-rollout-${{ matrix.part }}-${{ github.sha }}
          path: ${{ runner.temp }}/fleet-rollout.xml
          if-no-files-found: error

  fleet-cancel-path-acceptance:
    # #396: cancelling an active standard apply shut the hosted runner down mid-run.
    # These tests run apart from the fleet job, with every kill/tgkill syscall audited
    # and streamed live, so the log names the sender and target even if the runner dies.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERTEP_STREAM_FAILURES: "1"
      VERTEP_REQUIRE_STANDARD_HOST_CONSUMER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Audit signals sent on the host
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq auditd
          sudo auditctl -a always,exit -F arch=b64 -S kill -S tkill -S tgkill -k vertep_signal
          sudo auditctl -l
      - name: Cancel an active standard apply
        run: |
          ( sudo tail -n0 -F /var/log/audit/audit.log | grep --line-buffered -E 'key="vertep_signal"|type=OBJ_PID' | sed -u 's/^/[signal] /' ) &
          python -m pytest -v -o junit_family=legacy -o faulthandler_timeout=600 \
            --junitxml="$RUNNER_TEMP/fleet-cancel-path.xml" \
            --basetemp="$RUNNER_TEMP/fleet-cancel-path" \
            tests/test_standard_host_consumer_docker.py::test_interruption_during_apply_does_not_overwrite_newer_data \
            tests/test_standard_host_consumer_docker.py::test_retry_does_not_return_deleted_seeds \
            tests/test_standard_host_consumer_docker.py::test_cancel_during_an_active_standard_apply_kills_it_without_a_delayed_effect \
            tests/test_core_rollout_coordinator.py \
            tests/test_standard_host_consumer_docker.py::test_losing_the_lease_database_kills_the_active_apply_and_a_retry_succeeds_after_restart
      - name: Audited signals
        if: always()
        run: sudo ausearch -k vertep_signal -i 2>/dev/null | tail -200 || true
      - name: Upload cancel-path evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fleet-cancel-path-${{ github.sha }}
          path: ${{ runner.temp }}/fleet-cancel-path.xml
          if-no-files-found: warn

  criterion-390-report:
    # #401 P5: one criterion report over every JUnit of this SHA. The fleet, cancel-path and
    # local-contracts jobs each run part of the matrix; read alone, the fleet report showed
    # the accepted cancel-path and restore-caller tests as NOT_RUN.
    needs: [fleet-persistence-runtime-acceptance, fleet-rollout-acceptance, fleet-cancel-path-acceptance, local-contracts,
            moneyprinter-pinned-runtime]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          pattern: "{fleet-persistence-runtime,fleet-rollout-workers-first,fleet-rollout-consumer,fleet-cancel-path,local-contracts,moneyprinter-pinned-runtime}-${{ github.sha }}"
          path: ${{ runner.temp }}/junit
      - name: Criterion report over all JUnit of this SHA
        run: |
          set -- $(find "$RUNNER_TEMP/junit" -name '*.xml' ! -path '*/backup-process-*' | sort)
          for file in "$@"; do echo "JUnit: $file"; done
          args=(); for file in "$@"; do args+=(--junit "$file"); done
          python scripts/report_criterion_390.py --run-sha "$GITHUB_SHA" "${args[@]}" --output "$RUNNER_TEMP/criterion-390-all.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: criterion-390-${{ github.sha }}
          path: ${{ runner.temp }}/criterion-390-all.json
          if-no-files-found: warn

  media-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare non-secret CI configuration
        run: |
          cp .env.example .env
          printf '\nNODE_NAME=ci-worker\nCORE_ADDRESS=http://127.0.0.1:8080\nPOSTGRES_PASSWORD=ci-only\n' >> .env
          printf 'ci-only-secret-store-passphrase' > config/secret-store.passphrase
      - name: Install media tools
        # A slow package mirror stalled here silently until the job limit: fail fast, name the step.
        timeout-minutes: 12
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y redis-server espeak-ng ffmpeg
      - name: Run the media acceptance harness and record evidence
        env:
          VERTEP_MEDIA_EVIDENCE: media-evidence/${{ github.run_id }}-${{ github.run_attempt }}/evidence.json
          VERTEP_REQUIRE_TEXT_REDIS_PROCESS: "1"
          VERTEP_REQUIRE_ESPEAK: "1"
        run: |
          redis-server --version
          espeak-ng --version
          RUN_DIR="media-evidence/${{ github.run_id }}-${{ github.run_attempt }}"
          BASE_TEMP="$RUNNER_TEMP/media-runtime-tests"
          mkdir -p "$RUN_DIR"
          mkdir -p "$BASE_TEMP"
          python -m pytest -v -o faulthandler_timeout=300 --durations=15 -o junit_family=legacy --junitxml="$RUN_DIR/junit.xml" --basetemp="$BASE_TEMP" tests/test_full_media_harness.py tests/test_text_redis_process.py tests/test_delivery_process_acceptance.py tests/test_voice_http_acceptance.py tests/test_publisher_http_boundary.py tests/test_publisher_oauth_state.py tests/test_media_acceptance_report.py
      - name: Render the media acceptance report
        run: |
          python scripts/media-acceptance-report.py \
            --evidence media-evidence/${{ github.run_id }}-${{ github.run_attempt }}/evidence.json \
            --out media-evidence/media-acceptance \
            --require-all --include-text-process --expected-sha "$GITHUB_SHA"
      - name: Upload media acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: media-acceptance
          path: media-evidence
          if-no-files-found: warn

  infrastructure-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare non-secret CI configuration
        run: |
          cp .env.example .env
          printf '\nNODE_NAME=ci-worker\nCORE_ADDRESS=http://127.0.0.1:8080\nPOSTGRES_PASSWORD=ci-only\n' >> .env
          cp .env deploy/.env
          cp -r monitoring deploy/monitoring
          printf 'ci-only-secret-store-passphrase' > config/secret-store.passphrase
      - name: Run infrastructure qualification proof
        run: python scripts/qualify_infrastructure.py --run --output infrastructure-qualification.json
      - name: Upload infrastructure qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: infrastructure-qualification
          path: infrastructure-qualification.json
          if-no-files-found: warn

  bootstrap-lifecycle-acceptance:
    # #384/#388 B2: the executor trust matrix runs inside a linux/<arch> container
    # (QEMU for arm64); the Docker apply executor runs on the host daemon.
    # B1 publication and B3 host TLS remain separate gates.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: docker/setup-qemu-action@v3
        if: matrix.architecture == 'arm64'
      - name: Install acceptance dependencies
        run: python -m pip install -r requirements.txt
      - name: Run disposable bootstrap and update executor acceptance
        run: >-
          python scripts/qualify_bootstrap_lifecycle.py
          --architecture "${{ matrix.architecture }}"
          --junit "$RUNNER_TEMP/bootstrap-lifecycle-${{ matrix.architecture }}.xml"
          --output "$RUNNER_TEMP/bootstrap-lifecycle-${{ matrix.architecture }}.json"
      - name: Upload bootstrap lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-lifecycle-${{ github.sha }}-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/bootstrap-lifecycle-${{ matrix.architecture }}.xml
            ${{ runner.temp }}/bootstrap-lifecycle-${{ matrix.architecture }}.json
            ${{ runner.temp }}/executor-${{ matrix.architecture }}/**
          if-no-files-found: error

  ubuntu-bootstrap-lifecycle:
    # #388 B3: run the real bootstrap.sh on a disposable Ubuntu 24.04 runner:
    # pinned container runtime, latest published signed release, HTTPS handshake,
    # certificate renewal picked up by the proxy reload, data/credentials kept
    # across a bootstrap rerun.  The installed version is the latest *published*
    # release; the evidence records it next to this SHA.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space for the appliance images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /opt
      - name: Remove the runner's preinstalled Docker CE
        # bootstrap.sh installs and verifies the pinned Ubuntu docker.io runtime.
        run: |
          sudo systemctl stop docker.socket docker containerd || true
          sudo apt-get purge -y -qq docker-ce docker-ce-cli docker-ce-rootless-extras             containerd.io docker-buildx-plugin docker-compose-plugin             moby-engine moby-cli moby-buildx moby-compose moby-containerd moby-runc || true
          sudo rm -f /etc/apt/sources.list.d/docker.list /etc/apt/sources.list.d/docker.sources
          sudo rm -rf /var/lib/docker /var/lib/containerd
      - name: Bootstrap, renew TLS and rerun
        # The unauthenticated GitHub API limit is shared by the runner IP (403); the
        # read-only job token is handed to bootstrap's curl calls via CURL_HOME only.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/curl"
          ( umask 077; printf 'header = "Authorization: Bearer %s"\n' "$GITHUB_TOKEN" > "$RUNNER_TEMP/curl/.curlrc" )
          CURL_HOME="$RUNNER_TEMP/curl" sudo -E python3 scripts/qualify_ubuntu_bootstrap.py --output "$RUNNER_TEMP/ubuntu-bootstrap/evidence.json"
      - name: Upload Ubuntu bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-bootstrap-${{ github.sha }}
          path: ${{ runner.temp }}/ubuntu-bootstrap/
          if-no-files-found: error

  persistence-trust-acceptance:
    # #374/#375: these checks must run against the runner's Linux Docker
    # daemon.  A local skipped Docker marker is never acceptance evidence.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare non-secret acceptance configuration
        run: |
          cp .env.example .env
          printf '\nNODE_NAME=ci-worker\nCORE_ADDRESS=http://127.0.0.1:8080\nPOSTGRES_PASSWORD=ci-only\n' >> .env
          cp .env deploy/.env
          cp -r monitoring deploy/monitoring
          printf 'ci-only-secret-store-passphrase' > config/secret-store.passphrase
      - name: Run persistence and artifact qualification acceptance
        env:
          VERTEP_REQUIRE_APPLY_DEPLOYMENT_DOCKER: "1"
        run: >-
          python -m pytest -q -o junit_family=legacy
          --junitxml="$RUNNER_TEMP/persistence-trust.xml"
          --basetemp="$RUNNER_TEMP/persistence-trust"
          tests/test_apply_deployment_docker.py
          tests/test_backup_process_acceptance.py tests/test_backup_restore_durable.py
          tests/test_release_qualification.py tests/test_trust_caller_acceptance.py
      - name: Qualify the checked-out artifact root against Docker
        run: >-
          python scripts/qualify-release.py --root . --docker
          --output "$RUNNER_TEMP/persistence-trust-qualification.json"
      - name: Upload persistence and trust evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: persistence-trust-${{ github.sha }}
          path: |
            ${{ runner.temp }}/persistence-trust.xml
            ${{ runner.temp }}/persistence-trust-qualification.json
            ${{ runner.temp }}/persistence-trust/**/backup-process-*.log
          if-no-files-found: error

  moneyprinter-pinned-image:
    # #376: this is the only proof that builds and executes the agreed pinned
    # upstream; fixture/stand-in tests cannot make this job green. The other pinned
    # jobs load this exact image, so all evidence of a SHA keeps one image digest.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime-check dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify MPT bridge regressions
        run: >-
          python -m pytest -q tests/test_moneyprinter_runtime.py
          tests/test_assembly_worker_route.py tests/test_mpt_recovery.py
          tests/test_mpt_media_matrix.py tests/test_issue_122_acceptance_report.py
      - name: Build and execute pinned MoneyPrinterTurbo
        run: >-
          python scripts/moneyprinter-runtime-check.py --timeout 900 --keep
          --evidence moneyprinter-runtime-evidence
      - name: Save the pinned image for the media and lifecycle jobs
        run: docker save vertep/moneyprinter-runtime-check | gzip -1 > "$RUNNER_TEMP/mpt-image.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: moneyprinter-pinned-image-${{ github.sha }}
          path: ${{ runner.temp }}/mpt-image.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload pinned evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: moneyprinter-evidence-image-${{ github.sha }}
          path: moneyprinter-runtime-evidence
          # A failure before the runtime check may leave no evidence directory;
          # preserve that original failing step instead of masking it here.
          if-no-files-found: warn

  moneyprinter-pinned-media:
    needs: moneyprinter-pinned-image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime-check dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: moneyprinter-pinned-image-${{ github.sha }}
          path: ${{ runner.temp }}/mpt-image
      - name: Load the pinned image built for this SHA
        run: gunzip -c "$RUNNER_TEMP/mpt-image/mpt-image.tar.gz" | docker load
      - name: Recover pinned submits across a runtime restart
        run: >-
          python scripts/moneyprinter-recovery-check.py --timeout 900
          --evidence moneyprinter-runtime-evidence/recovery.json
      - name: Start the pinned runtime
        run: python scripts/moneyprinter-recovery-check.py --timeout 900 --serve "$GITHUB_ENV"
      - name: Run the agreed media matrix against the pinned runtime
        # #389 M1: the same test IDs as the stand-in run, now through the real
        # pinned submit/status/download route; stand-in fault injections are skipped.
        run: >-
          python -m pytest -q -rs --durations=25 -o junit_family=legacy
          --junitxml=moneyprinter-runtime-evidence/media-matrix-pinned.xml
          tests/test_mpt_media_matrix.py
      - name: Stop the pinned runtime
        if: always()
        run: |
          if [ -n "${VERTEP_MPT_PINNED_CONTAINER:-}" ]; then
            python scripts/moneyprinter-recovery-check.py --stop "$VERTEP_MPT_PINNED_CONTAINER"
          fi
      - name: Upload pinned evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: moneyprinter-evidence-media-${{ github.sha }}
          path: moneyprinter-runtime-evidence
          # A failure before the runtime check may leave no evidence directory;
          # preserve that original failing step instead of masking it here.
          if-no-files-found: warn

  moneyprinter-pinned-lifecycle:
    needs: moneyprinter-pinned-image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime-check dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: moneyprinter-pinned-image-${{ github.sha }}
          path: ${{ runner.temp }}/mpt-image
      - name: Load the pinned image built for this SHA
        run: gunzip -c "$RUNNER_TEMP/mpt-image/mpt-image.tar.gz" | docker load
      - name: Start the pinned runtime
        run: python scripts/moneyprinter-recovery-check.py --timeout 900 --serve "$GITHUB_ENV"
      - name: CORE/Worker process lifecycle on the pinned runtime (#397 M2)
        run: >-
          python -m pytest -q -rs --durations=25 -o junit_family=legacy
          --junitxml=moneyprinter-runtime-evidence/process-lifecycle-pinned.xml
          tests/test_mpt_process_lifecycle.py
      - name: Pinned MPT output read back across a standard CORE update and rollback (#403 R2)
        env:
          VERTEP_REQUIRE_STANDARD_HOST_CONSUMER: "1"
        run: >-
          python -m pytest -q -rs -o junit_family=legacy
          --junitxml=moneyprinter-runtime-evidence/pinned-output-update-rollback.xml
          tests/test_standard_core_consumer_docker.py::test_core_reads_back_a_pinned_mpt_output_across_update_and_rollback
      - name: Stop the pinned runtime
        if: always()
        run: |
          if [ -n "${VERTEP_MPT_PINNED_CONTAINER:-}" ]; then
            python scripts/moneyprinter-recovery-check.py --stop "$VERTEP_MPT_PINNED_CONTAINER"
          fi
      - name: Upload pinned evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: moneyprinter-evidence-lifecycle-${{ github.sha }}
          path: moneyprinter-runtime-evidence
          # A failure before the runtime check may leave no evidence directory;
          # preserve that original failing step instead of masking it here.
          if-no-files-found: warn

  moneyprinter-pinned-runtime:
    # One report and one evidence artifact over the three pinned jobs of this SHA.
    needs: [moneyprinter-pinned-image, moneyprinter-pinned-media, moneyprinter-pinned-lifecycle]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime-check dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v7
        with:
          pattern: "moneyprinter-evidence-*-${{ github.sha }}"
          path: ${{ runner.temp }}/mpt-evidence
          merge-multiple: true
      - name: Collect the evidence of the pinned jobs
        run: |
          mkdir -p moneyprinter-runtime-evidence
          cp -r "$RUNNER_TEMP/mpt-evidence/." moneyprinter-runtime-evidence/
      - name: Require every pinned job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "pinned jobs: $RESULTS"
          for result in $RESULTS; do [ "$result" = success ]; done
      - name: Render MPT criterion evidence report
        run: >-
          python scripts/issue-122-acceptance-report.py
          --only contract,media,integration,recovery,lifecycle_state,security,configuration,delivery
          --pinned-evidence moneyprinter-runtime-evidence
          --out moneyprinter-runtime-evidence/criterion-report
      - name: Upload pinned evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: moneyprinter-pinned-runtime-${{ github.sha }}
          path: moneyprinter-runtime-evidence
          # A failure before the runtime check may leave no evidence directory;
          # preserve that original failing step instead of masking it here.
          if-no-files-found: warn
