name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gpu-built-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Встановлення залежностей acceptance tests
        run: python -m pip install -r requirements.txt
      - name: Pinned GPU image, inventory delivery, readiness та media trace
        env:
          VERTEP_REQUIRE_GPU_BUILT_INVENTORY: "1"
        run: >-
          python -m pytest -q tests/test_gpu_built_inventory.py
          tests/test_gpu_runtime_inventory_delivery.py tests/test_gpu_http_pipeline.py
          tests/test_gpu_media_fixtures.py tests/test_comfyui_runtime_inventory.py
          -o junit_family=legacy --junitxml=${{ runner.temp }}/gpu-inventory.xml
          --basetemp=${{ runner.temp }}/gpu-inventory
      - name: Збереження image identity та actual inventory evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gpu-inventory-${{ github.sha }}
          path: |
            ${{ runner.temp }}/gpu-inventory.xml
            ${{ runner.temp }}/gpu-inventory/**/gpu-build.log
            ${{ runner.temp }}/gpu-inventory/**/gpu-built-evidence.json

  runtime-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and execute the standard runtime identity probe
        run: python scripts/verify-runtime-identity.py --evidence runtime-identity-evidence.json
      - name: Upload runtime identity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-identity
          path: runtime-identity-evidence.json
          if-no-files-found: error

  local-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERTEP_TEST_REDIS_URL: redis://localhost:6379/0
      VERTEP_REQUIRE_PKI_CALLER_ACCEPTANCE: "1"
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install redis-server for queue persistence tests
        run: |
          if [ -f /usr/sbin/policy-rc.d ]; then sudo cp /usr/sbin/policy-rc.d /usr/sbin/policy-rc.d.bak; fi
          printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d > /dev/null
          sudo chmod +x /usr/sbin/policy-rc.d
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq redis-server
          if [ -f /usr/sbin/policy-rc.d.bak ]; then sudo mv /usr/sbin/policy-rc.d.bak /usr/sbin/policy-rc.d; else sudo rm -f /usr/sbin/policy-rc.d; fi
          redis-server --version
      - name: Prepare non-secret CI configuration
        run: |
          cp .env.example .env
          printf '\nNODE_NAME=ci-worker\nCORE_ADDRESS=http://127.0.0.1:8080\nPOSTGRES_PASSWORD=ci-only\n' >> .env
          cp .env deploy/.env
          cp -r monitoring deploy/monitoring
          printf 'ci-only-secret-store-passphrase' > config/secret-store.passphrase
      - name: Compile Python sources
        run: python -m compileall -q core adapters worker telegram publishers scripts lab tests
      - name: Run test suite
        run: |
          openssl version
          python -m pytest -q -o junit_family=legacy --junitxml="$RUNNER_TEMP/local-contracts.xml" --basetemp="$RUNNER_TEMP/local-contracts"
      - name: Збереження exact-SHA process та trust acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-contracts-${{ github.sha }}
          path: |
            ${{ runner.temp }}/local-contracts.xml
            ${{ runner.temp }}/local-contracts/**/backup-process-*.log
      - name: Validate shell syntax
        run: bash -n bootstrap.sh install.sh installer/*.sh scripts/vertep scripts/restore.sh
      - name: Validate Compose configurations
        run: |
          docker compose -f docker-compose.yml config --quiet
          VERTEP_VERSION=$(cat VERSION) docker compose -f docker-compose.yml -f docker-compose.moneyprinter.yml --profile moneyprinter config --quiet
          docker compose -f docker-compose.worker.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
          docker compose --env-file .env -f deploy/docker-compose.yml config --quiet
      - name: Build role runtime images
        run: |
          docker build -f docker/tts/Dockerfile -t vertep/tts:ci .
          docker build -f docker/publisher/Dockerfile -t vertep/publisher:ci .
          docker build -f docker/backup/Dockerfile -t vertep/backup:ci .
      - name: Validate monitoring configuration
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /usr/bin/loki \
            -v "$PWD/monitoring/loki.yml:/etc/loki/config.yml:ro" grafana/loki:3.5.2 \
            -verify-config=true -config.file=/etc/loki/config.yml
          docker run --rm --entrypoint /usr/bin/promtail \
            -v "$PWD/monitoring/promtail.yml:/etc/promtail/config.yml:ro" grafana/promtail:3.5.2 \
            -check-syntax -config.file=/etc/promtail/config.yml -config.expand-env=true
      - name: Run appliance release qualification gates
        run: python scripts/qualify-release.py --root . --docker --output qualification.json
      - name: Verify the pinned MoneyPrinterTurbo runtime once
        run: |
          python scripts/moneyprinter-runtime-check.py \
            --timeout 900 --evidence moneyprinter-runtime-evidence
      - name: Upload MoneyPrinterTurbo runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: moneyprinter-runtime-check
          path: moneyprinter-runtime-evidence
          if-no-files-found: warn
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appliance-qualification
          path: qualification.json
          if-no-files-found: warn

  postgres-backfill:
    # Issue #135: the backfill/lifecycle evidence must run against a real,
    # disposable PostgreSQL — a skipped integration test is not a PASS.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERTEP_TEST_DATABASE_URL: postgresql://vertep:ci-only@localhost:5432/vertep
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vertep
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: vertep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vertep"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run PostgreSQL backfill integration and unit tests
        run: python -m pytest -q tests/test_backfill_postgres.py tests/test_backfill.py tests/test_persistent_user_data.py tests/test_workflow_postgres_state.py

  fleet-persistence-runtime-acceptance:
    # #378/#379: these two remaining boundaries need a real PostgreSQL epoch,
    # Linux process groups and Docker-backed healthy CORE dependencies.  They
    # are fail-closed rather than local skips.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VERTEP_REQUIRE_DISTRIBUTED_UPDATE_FENCE: "1"
      VERTEP_UPDATE_LEASE_DATABASE_URL: postgresql://vertep:ci-only@localhost:5432/vertep
      VERTEP_REQUIRE_CONNECTED_RESTORE: "1"
      VERTEP_CONNECTED_RESTORE_DATABASE_URL: postgresql://vertep:ci-only@localhost:5432/vertep
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vertep
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: vertep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vertep"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run actual PostgreSQL fencing and connected healthy restore
        run: >-
          python -m pytest -q -o junit_family=legacy
          --junitxml="$RUNNER_TEMP/fleet-persistence-runtime.xml"
          --basetemp="$RUNNER_TEMP/fleet-persistence-runtime"
          tests/test_core_rollout_coordinator.py::test_postgres_epoch_takeover_stops_active_host_apply
          tests/test_backup_process_acceptance.py::test_connected_healthy_restore_returns_normal_after_core_restart
      - name: Upload fleet and connected restore evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fleet-persistence-runtime-${{ github.sha }}
          path: |
            ${{ runner.temp }}/fleet-persistence-runtime.xml
            ${{ runner.temp }}/fleet-persistence-runtime/**/backup-process-*.log
          if-no-files-found: error

  media-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare non-secret CI configuration
        run: |
          cp .env.example .env
          printf '\nNODE_NAME=ci-worker\nCORE_ADDRESS=http://127.0.0.1:8080\nPOSTGRES_PASSWORD=ci-only\n' >> .env
          printf 'ci-only-secret-store-passphrase' > config/secret-store.passphrase
      - name: Run the media acceptance harness and record evidence
        env:
          VERTEP_MEDIA_EVIDENCE: media-evidence/${{ github.run_id }}-${{ github.run_attempt }}/evidence.json
          VERTEP_REQUIRE_TEXT_REDIS_PROCESS: "1"
          VERTEP_REQUIRE_ESPEAK: "1"
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq redis-server espeak-ng ffmpeg
          redis-server --version
          espeak-ng --version
          RUN_DIR="media-evidence/${{ github.run_id }}-${{ github.run_attempt }}"
          BASE_TEMP="$RUNNER_TEMP/media-runtime-tests"
          mkdir -p "$RUN_DIR"
          mkdir -p "$BASE_TEMP"
          python -m pytest -q -o junit_family=legacy --junitxml="$RUN_DIR/junit.xml" --basetemp="$BASE_TEMP" tests/test_full_media_harness.py tests/test_text_redis_process.py tests/test_delivery_process_acceptance.py tests/test_voice_http_acceptance.py tests/test_publisher_http_boundary.py tests/test_publisher_oauth_state.py tests/test_media_acceptance_report.py
      - name: Render the media acceptance report
        run: |
          python scripts/media-acceptance-report.py \
            --evidence media-evidence/${{ github.run_id }}-${{ github.run_attempt }}/evidence.json \
            --out media-evidence/media-acceptance \
            --require-all --include-text-process --expected-sha "$GITHUB_SHA"
      - name: Upload media acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: media-acceptance
          path: media-evidence
          if-no-files-found: warn

  infrastructure-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare non-secret CI configuration
        run: |
          cp .env.example .env
          printf '\nNODE_NAME=ci-worker\nCORE_ADDRESS=http://127.0.0.1:8080\nPOSTGRES_PASSWORD=ci-only\n' >> .env
          cp .env deploy/.env
          cp -r monitoring deploy/monitoring
          printf 'ci-only-secret-store-passphrase' > config/secret-store.passphrase
      - name: Run infrastructure qualification proof
        run: python scripts/qualify_infrastructure.py --run --output infrastructure-qualification.json
      - name: Upload infrastructure qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: infrastructure-qualification
          path: infrastructure-qualification.json
          if-no-files-found: warn

  bootstrap-lifecycle-acceptance:
    # #384 B2: exercise the real Docker executor under both supported Linux
    # architectures. B1 publication and B3 host TLS remain separate gates.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: docker/setup-qemu-action@v3
        if: matrix.architecture == 'arm64'
      - name: Install acceptance dependencies
        run: python -m pip install -r requirements.txt
      - name: Run disposable bootstrap and update executor acceptance
        run: >-
          python scripts/qualify_bootstrap_lifecycle.py
          --architecture "${{ matrix.architecture }}"
          --junit "$RUNNER_TEMP/bootstrap-lifecycle-${{ matrix.architecture }}.xml"
          --output "$RUNNER_TEMP/bootstrap-lifecycle-${{ matrix.architecture }}.json"
      - name: Upload bootstrap lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-lifecycle-${{ github.sha }}-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/bootstrap-lifecycle-${{ matrix.architecture }}.xml
            ${{ runner.temp }}/bootstrap-lifecycle-${{ matrix.architecture }}.json
          if-no-files-found: error

  persistence-trust-acceptance:
    # #374/#375: these checks must run against the runner's Linux Docker
    # daemon.  A local skipped Docker marker is never acceptance evidence.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare non-secret acceptance configuration
        run: |
          cp .env.example .env
          printf '\nNODE_NAME=ci-worker\nCORE_ADDRESS=http://127.0.0.1:8080\nPOSTGRES_PASSWORD=ci-only\n' >> .env
          cp .env deploy/.env
          cp -r monitoring deploy/monitoring
          printf 'ci-only-secret-store-passphrase' > config/secret-store.passphrase
      - name: Run persistence and artifact qualification acceptance
        env:
          VERTEP_REQUIRE_APPLY_DEPLOYMENT_DOCKER: "1"
        run: >-
          python -m pytest -q -o junit_family=legacy
          --junitxml="$RUNNER_TEMP/persistence-trust.xml"
          --basetemp="$RUNNER_TEMP/persistence-trust"
          tests/test_apply_deployment_docker.py
          tests/test_backup_process_acceptance.py tests/test_backup_restore_durable.py
          tests/test_release_qualification.py tests/test_trust_caller_acceptance.py
      - name: Qualify the checked-out artifact root against Docker
        run: >-
          python scripts/qualify-release.py --root . --docker
          --output "$RUNNER_TEMP/persistence-trust-qualification.json"
      - name: Upload persistence and trust evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: persistence-trust-${{ github.sha }}
          path: |
            ${{ runner.temp }}/persistence-trust.xml
            ${{ runner.temp }}/persistence-trust-qualification.json
            ${{ runner.temp }}/persistence-trust/**/backup-process-*.log
          if-no-files-found: error

  moneyprinter-pinned-runtime:
    # #376: this is the only proof that builds and executes the agreed pinned
    # upstream; fixture/stand-in tests cannot make this job green.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime-check dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify MPT bridge regressions
        run: >-
          python -m pytest -q tests/test_moneyprinter_runtime.py
          tests/test_assembly_worker_route.py tests/test_mpt_recovery.py
          tests/test_mpt_media_matrix.py tests/test_issue_122_acceptance_report.py
      - name: Build and execute pinned MoneyPrinterTurbo
        run: >-
          python scripts/moneyprinter-runtime-check.py --timeout 900
          --evidence moneyprinter-runtime-evidence
      - name: Render MPT criterion evidence report
        run: >-
          python scripts/issue-122-acceptance-report.py
          --only contract,media,integration,recovery,lifecycle_state,security,configuration,delivery
          --out moneyprinter-runtime-evidence/criterion-report
      - name: Upload pinned runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: moneyprinter-pinned-runtime-${{ github.sha }}
          path: moneyprinter-runtime-evidence
          if-no-files-found: error
