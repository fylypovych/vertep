<header class="h-16 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between px-4 lg:px-6 flex-shrink-0">
  <!-- Left: toggle + title -->
  <div class="flex items-center gap-3">
    <button (click)="toggleSidebar()"
            class="p-2 rounded-lg text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"
            aria-label="Перемикач меню">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
    <div class="hidden sm:block">
      <h1 class="text-base font-semibold text-slate-800 dark:text-slate-100 leading-tight">{{ title }}</h1>
      <p class="text-xs text-slate-500 dark:text-slate-400 leading-tight">{{ subtitle }}</p>
    </div>
  </div>

  <!-- Right: actions -->
  <div class="flex items-center gap-1.5">
    <!-- System state badge -->
    <div class="hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium"
         [class.bg-emerald-50]="systemOk"
         [class.text-emerald-700]="systemOk"
         [class.bg-amber-50]="!systemOk"
         [class.text-amber-700]="!systemOk"
         [class.bg-red-50]="systemState === 'Аварія' || systemState === 'EMERGENCY'"
         [class.text-red-700]="systemState === 'Аварія' || systemState === 'EMERGENCY'"
         [class.bg-blue-50]="systemState === 'Тільки читання' || systemState === 'READ_ONLY'"
         [class.text-blue-700]="systemState === 'Тільки читання' || systemState === 'READ_ONLY'">
      <span class="w-1.5 h-1.5 rounded-full"
            [class.bg-emerald-500]="systemOk"
            [class.bg-amber-500]="!systemOk && systemState !== 'Аварія' && systemState !== 'EMERGENCY' && systemState !== 'Тільки читання' && systemState !== 'READ_ONLY'"
            [class.bg-red-500]="systemState === 'Аварія' || systemState === 'EMERGENCY'"
            [class.bg-blue-500]="systemState === 'Тільки читання' || systemState === 'READ_ONLY'"></span>
      {{ systemState }}
      @if (systemReason && !systemOk) {
        <span class="ml-1 text-[10px] opacity-75">({{ systemReason }})</span>
      }
    </div>

    <!-- Dark mode toggle -->
    <button (click)="toggleTheme()"
            class="p-2 rounded-lg text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"
            [title]="isDark ? 'Світла тема' : 'Темна тема'">
      @if (isDark) {
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
      } @else {
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
      }
    </button>

    <!-- Switch to v1 -->
    <button (click)="switchToV1()"
            class="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300 text-sm font-medium hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors"
            title="Класичний дизайн v1">
      v1
    </button>

    <!-- User profile dropdown -->
    <div class="relative profile-menu-container">
      <button (click)="toggleProfileMenu()"
              class="flex items-center gap-2 p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"
              aria-label="Меню користувача"
              aria-expanded="{{ showProfileMenu }}"
              aria-haspopup="true">
        <div class="w-8 h-8 bg-emerald-100 dark:bg-emerald-900 rounded-full flex items-center justify-center text-emerald-700 dark:text-emerald-400 font-semibold text-sm select-none">{{ userInitial }}</div>
        <span class="hidden sm:block text-sm font-medium text-slate-700 dark:text-slate-300">{{ userRole === 'admin' ? 'Адмін' : 'Переглядач' }}</span>
        <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
      </button>

      @if (showProfileMenu) {
        <div class="absolute right-0 mt-2 w-56 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-lg py-1 z-50 animate-fade-in">
          <div class="px-4 py-3 border-b border-slate-200 dark:border-slate-700">
            <p class="text-sm font-semibold text-slate-900 dark:text-slate-100">{{ userRole === 'admin' ? 'Адміністратор' : 'Переглядач' }}</p>
            <p class="text-xs text-slate-500 dark:text-slate-400 truncate">{{ userInitial }} (перевірено)</p>
          </div>
          <a routerLink="/profile" (click)="showProfileMenu = false"
             class="flex items-center gap-3 px-4 py-2.5 text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            Профіль
          </a>
          <a routerLink="/profile" fragment="password" (click)="showProfileMenu = false"
             class="flex items-center gap-3 px-4 py-2.5 text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
            Змінити пароль
          </a>
          <hr class="my-1 border-slate-200 dark:border-slate-700">
          <button (click)="logout()"
                  class="flex items-center gap-3 w-full px-4 py-2.5 text-sm text-red-600 dark:text-red-400 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors text-left">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
            Вийти
          </button>
        </div>
      }
    </div>
  </div>
</header>
