services:
  core:
    build: .
    command: uvicorn core.app:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      STORAGE_BACKEND: ${STORAGE_BACKEND:-postgres}
      DATABASE_URL: postgresql://vertep:${POSTGRES_PASSWORD}@postgres:5432/vertep
      UPDATE_STATE_DIR: /var/lib/vertep/update
    volumes:
      - jobs:/data/jobs
      - logs:/data/logs
      - ./characters:/app/characters:ro
      - ./runtime/update:/var/lib/vertep/update
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build: .
    command: python -m worker.service
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_NAME: ${NODE_NAME:-gpu-demo-01}
      CORE_ADDRESS: ${CORE_ADDRESS:-http://core:8080}
    volumes:
      - ./workflows:/app/workflows:ro
      - logs:/data/logs
    depends_on:
      - core
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vertep
      POSTGRES_USER: vertep
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vertep -d vertep"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  jobs:
  redis-data:
  postgres-data:
  logs:
