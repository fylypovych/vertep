<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Публікації</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; color: #0f172a; background: #f8fafc; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; }
  .muted { color: #64748b; font-size: 13px; }
  button { margin-right: 6px; }
</style>
</head>
<body>
  <h1>Публікації</h1>
  <p class="muted">Статуси публікацій ваших брендів. Відправляє Worker; канали й політики задаються в «Брендах».</p>
  <div id="list"></div>
  <script>
    const API = '/api/modules/publishing/v1';
    const CHANNELS = ['youtube', 'tiktok', 'facebook', 'instagram', 'threads', 'telegram'];
    function text(value) { const span = document.createElement('span'); span.textContent = value == null ? '' : String(value); return span.innerHTML; }
    async function load() {
      const root = document.getElementById('list');
      try {
        const response = await fetch(API + '/publications');
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const items = await response.json();
        root.innerHTML = items.map(item => {
          const rows = Object.entries(item.publications).map(([channel, p]) =>
            '<div>' + text(channel) + ': ' + text(p.status) + (p.url ? ' · ' + text(p.url) : '') + (p.error ? ' · ' + text(p.error) : '') + '</div>').join('');
          const buttons = CHANNELS.map(c => '<button data-job="' + text(item.job_id) + '" data-channel="' + c + '">' + c + '</button>').join('');
          return '<div class="card"><strong>' + text(item.topic) + '</strong> <span class="muted">' + text(item.job_id) + ' · ' +
            text(item.brand_id) + ' · ' + text(item.status) + '</span>' + rows +
            '<div class="muted">Опублікувати в:</div>' + buttons + '</div>';
        }).join('') || '<p class="muted">Публікацій ще немає.</p>';
        for (const button of root.querySelectorAll('button')) {
          button.addEventListener('click', async () => {
            const result = await fetch(API + '/publications/' + encodeURIComponent(button.dataset.job) + '/publish', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ channels: [button.dataset.channel] }) });
            const body = await result.json().catch(() => ({}));
            alert(result.ok ? 'Публікацію запущено' : (body.detail || body.error || 'Помилка'));
            load();
          });
        }
      } catch (error) {
        root.innerHTML = '<p class="muted">Не вдалося завантажити публікації: ' + text(error.message) + '</p>';
      }
    }
    load();
  </script>
</body>
</html>
