<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бренди</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; color: #0f172a; background: #f8fafc; }
  .brand { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; }
  .muted { color: #64748b; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 4px 6px; border-top: 1px solid #f1f5f9; }
</style>
</head>
<body>
  <h1>Бренди</h1>
  <p class="muted">Бренди, їхні канали й політики публікації. Спільний канал підключається до кількох брендів без копіювання підключення.</p>
  <div id="brands"></div>
  <script>
    const API = '/api/modules/brands/v1';
    async function getJSON(path) {
      const response = await fetch(API + path, { headers: { 'Content-Type': 'application/json' } });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      return response.json();
    }
    function text(value) { const span = document.createElement('span'); span.textContent = value; return span.innerHTML; }
    async function load() {
      const root = document.getElementById('brands');
      try {
        const brands = await getJSON('/brands');
        const parts = [];
        for (const brand of brands) {
          const channels = await getJSON('/brands/' + encodeURIComponent(brand.id) + '/channels');
          const rows = channels.map(c => '<tr><td>' + text(c.channel_type) + '</td><td>' + text(c.target) + '</td><td>' + text(c.policy) + '</td></tr>').join('');
          parts.push('<div class="brand"><strong>' + text(brand.name) + '</strong> <span class="muted">' + text(brand.id) +
            ' · ' + (brand.publication_policy === 'automatic' ? 'автоматична публікація' : 'публікація після погодження') + '</span>' +
            '<table><tr><th>Канал</th><th>Ціль</th><th>Політика</th></tr>' + rows + '</table></div>');
        }
        root.innerHTML = parts.join('') || '<p class="muted">Брендів ще немає.</p>';
      } catch (error) {
        root.innerHTML = '<p class="muted">Не вдалося завантажити бренди: ' + text(error.message) + '</p>';
      }
    }
    load();
  </script>
</body>
</html>
