# Source:   upstream pyproject.toml / requirements.txt at the pinned commit,
#           minus the WebUI-only and Vertep-unused packages listed below.
#
# Excluded on purpose:
#   streamlit, streamlit-tour  — WebUI only. Vertep never loads webui/Main.py;
#                               the API runs from app.asgi.
#   faster-whisper             — brings ctranslate2 (~large native runtime) and is
#                               imported by app.services.subtitle behind a
#                               try/except ImportError. Vertep renders with
#                               subtitle_enabled=false and owns subtitle burn as
#                               a post-step, so upstream transcription is never used.
#   twelvelabs                 — optional extra, imported lazily by
#                               app.services.twelvelabs and never configured.
#   audioop-lts                — marker is python_version >= "3.13"; this image is
#                               built on python:3.12-slim where the stdlib audioop
#                               module pydub needs is still present.
#
# The first block mirrors upstream exactly (17 of the 21 upstream declarations,
# minus the four excluded above). The second block pins what the pinned tree
# imports or needs but does not declare, so the image does not depend on whatever
# a resolver happens to pick on build day. Nothing here may float.

