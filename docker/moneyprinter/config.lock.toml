# Vertep-owned MoneyPrinterTurbo configuration lock (Issue #122 P2).
#
# The container entrypoint renders /opt/moneyprinter/config.toml from this file.
# It is copied verbatim: the entrypoint only substitutes the `api_key` value, and
# every other key is asserted after rendering. If an assertion ever fails the
# container refuses to start instead of silently running with a drifted config.
#
# Rationale for the values that matter (Issue #122 §9.12, §11.2.5):
#   api_key                  — required, non-empty, generated by bootstrap.sh.
#   listen_host/listen_port  — upstream API binds loopback inside the container;
#                              the Vertep wrapper is the only external endpoint.
#   upload_post_*            — auto upload and platform publishing stay disabled.
#                              Vertep owns publishing; a pinned upstream runtime
#                              must never publish to a social network on its own.
#   enable_redis             — task queue stays in-process; Vertep owns the Job
#                              lifecycle and its own Redis.
#   material_directory       — "task" keeps staged clips inside the task dir, which
#                              is what Vertep's retention contract expects.
#   endpoint                 — empty: Vertep downloads artifacts over the
#                              authenticated API and never from public links.
#   video_source             — "local": upstream stock search is disabled, matching
#                              MONEY_PRINTER_CONTRACT.fixed_submission_values.
#   subtitle_provider        — empty: Vertep burns subtitles as a post-step, so
#                              upstream must not download Edge/Whisper models.
#   video_codec              — libx264 for a deterministic, CPU-only encode.

listen_host = "127.0.0.1"
listen_port = 8080
log_level = "INFO"
project_name = "Vertep-MoneyPrinterTurbo"

[app]
api_key = ""

material_directory = "task"
video_source = "local"
video_codec = "libx264"
subtitle_provider = ""
endpoint = ""
max_concurrent_tasks = 1
max_queued_tasks = 8

enable_redis = false
redis_host = ""

upload_post_enabled = false
upload_post_api_key = ""
upload_post_username = ""
upload_post_platforms = []
upload_post_auto_upload = false
upload_post_youtube_privacy_status = "private"
upload_post_youtube_made_for_kids = false
upload_post_max_pending_tasks = 0

[whisper]
model_size = "large-v3"
device = "cpu"
compute_type = "int8"

[proxy]

[azure]
speech_key = ""
speech_region = ""

[siliconflow]

[minimax_tts]

[elevenlabs]

[chatterbox]

[kokoro]

[fish_audio]

[voxcpm]

[ui]
hide_log = true
open_task_folder_on_completion = false