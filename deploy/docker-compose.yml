name: vertep
services:
  proxy:
    image: nginx:1.27-alpine
    ports: ["8443:8443"]
    volumes:
      - ./runtime/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/vertep/tls:ro
    depends_on:
      core: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://localhost:8443/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  core:
    image: ${VERTEP_IMAGE_REPOSITORY}/core:${VERTEP_VERSION}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vertep:${POSTGRES_PASSWORD}@postgres:5432/vertep
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JOB_ROOT: /data/storage/jobs
      LOG_ROOT: /data/logs
      UPDATE_STATE_DIR: /data/config/update
      CORE_CERTIFICATE_PATH: /data/tls/vertep.crt
      NODE_CA_KEY_PATH: /data/tls/node-ca.key
      NODE_CA_CERT_PATH: /data/tls/node-ca.crt
      NODE_MTLS_REQUIRED: "true"
      NODE_REGISTRY_BACKEND: postgres
      REQUIRE_WORKER_SELF_TEST: "true"
    volumes:
      - ./config:/data/config
      - ./logs:/data/logs
      - ./storage:/data/storage
      - ./backups:/data/backups
      - ./tls:/data/tls:ro
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  migrate:
    image: ${VERTEP_IMAGE_REPOSITORY}/core:${VERTEP_VERSION}
    command: ["python", "/app/scripts/migrate.py"]
    environment:
      DATABASE_URL: postgresql://vertep:${POSTGRES_PASSWORD}@postgres:5432/vertep
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
  worker:
    image: ${VERTEP_IMAGE_REPOSITORY}/worker:${VERTEP_VERSION}
    env_file: .env
    environment:
      CORE_ADDRESS: "${CORE_URL:-http://core:8080}"
      NODE_NAME: "${NODE_NAME:-local-worker}"
      NODE_ROLE: "${NODE_ROLE:-gpu}"
      NODE_CAPABILITIES: "${NODE_CAPABILITIES:-image_generation,image_upscale,controlnet,inpainting}"
      REGISTRATION_TOKEN: "${REGISTRATION_TOKEN:-}"
      CORE_CA_PATH: "${CORE_CA_PATH:-}"
      NODE_CONFIG_PATH: /data/config/node-credentials.json
      COMFYUI_URL: http://comfyui:8188
      OLLAMA_URL: http://ollama:11434
      TTS_HEALTH_URL: http://tts:8090/health
      PUBLISHER_HEALTH_URL: http://publisher-worker:8091/health
      PROMETHEUS_URL: http://monitoring:9090/-/healthy
      BACKUP_ROOT: /data/backups
    volumes: ["./models:/data/models", "./logs:/data/logs", "./config:/data/config", "./backups:/data/backups"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import worker.service' >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
    restart: unless-stopped
  comfyui:
    image: ${VERTEP_IMAGE_REPOSITORY}/comfyui:${VERTEP_VERSION}
    volumes: ["./models:/data/models", "./storage:/data/output"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8188/system_stats"]
      interval: 20s
      timeout: 10s
      retries: 30
    restart: unless-stopped
  tts:
    image: ${VERTEP_IMAGE_REPOSITORY}/tts:${VERTEP_VERSION}
    volumes: ["./models:/data/models", "./storage:/data/output"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/health"]
      interval: 20s
      timeout: 10s
      retries: 30
    restart: unless-stopped
  publisher-worker:
    image: ${VERTEP_IMAGE_REPOSITORY}/publisher-worker:${VERTEP_VERSION}
    env_file: .env
    volumes: ["./config:/data/config", "./logs:/data/logs", "./storage:/data/storage"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8091/health"]
      interval: 20s
      timeout: 10s
      retries: 30
    restart: unless-stopped
  backup-service:
    image: ${VERTEP_IMAGE_REPOSITORY}/backup:${VERTEP_VERSION}
    env_file: .env
    volumes: ["./config:/data/config:ro", "./storage:/data/storage:ro", "./backups:/data/backups"]
    healthcheck:
      test: ["CMD", "test", "-w", "/data/backups"]
      interval: 30s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: vertep, POSTGRES_USER: vertep, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vertep -d vertep"]
      interval: 5s
      timeout: 3s
      retries: 40
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 40
    environment: {REDIS_PASSWORD: "${REDIS_PASSWORD}"}
    restart: unless-stopped
  ollama:
    image: ollama/ollama:0.11.4
    volumes: ["models:/root/.ollama"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 20
    restart: unless-stopped
  monitoring:
    image: prom/prometheus:v3.5.0
    volumes: ["monitoring-data:/prometheus"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 10
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.1.1
    volumes: ["grafana-data:/var/lib/grafana"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 30s
      timeout: 10s
      retries: 20
    restart: unless-stopped
  update-agent:
    image: ${VERTEP_IMAGE_REPOSITORY}/update-agent:${VERTEP_VERSION}
    env_file: .env
    volumes:
      - ./config:/data/config
      - ./backups:/data/backups
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "test -d /data/config"]
      interval: 30s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres-data: {}
  redis-data: {}
  models: {}
  monitoring-data: {}
  grafana-data: {}
