name: vertep-lab-web

# Standalone frontend/API packaging; no production CORE or GPU dependency.
services:
  lab-control:
    build:
      context: ../..
      dockerfile: deploy/lab/Dockerfile
    image: ghcr.io/fylypovych/vertep-lab-control:${VERSION:-dev}
    command: ["uvicorn", "lab.api:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      LAB_STATE_DIR: /var/lib/vertep-lab
      LAB_WORKSPACE: /var/lib/vertep-lab/workspace
      LAB_POLICY_GATE_ACTIVE: "true"
      LAB_IDLE_SHARING_ENABLED: ${LAB_IDLE_SHARING_ENABLED:-false}
      LAB_RESOURCE_URL: ${LAB_RESOURCE_URL:-}
      LAB_RESOURCE_TOKEN: ${LAB_RESOURCE_TOKEN:-}
      LAB_OWNER_TOKEN: ${LAB_OWNER_TOKEN:-}
      LAB_OWNER_IDENTITY: ${LAB_OWNER_IDENTITY:-owner}
      LAB_GITHUB_TOKEN: ${LAB_GITHUB_TOKEN:-}
      LAB_GITHUB_REPOSITORY: ${LAB_GITHUB_REPOSITORY:-}
      LAB_ROLE_EXECUTOR_URL: ${LAB_ROLE_EXECUTOR_URL:-}
      LAB_ROLE_EXECUTOR_ENABLED: ${LAB_ROLE_EXECUTOR_ENABLED:-false}
      LAB_ROLE_EXECUTOR_TOKEN: ${LAB_ROLE_EXECUTOR_TOKEN:-}
      LAB_ROLE_EXECUTOR_TIMEOUT_SECONDS: "600"
      LAB_RESOURCE_CA_FILE: ${LAB_RESOURCE_CA_FILE:-}
    volumes:
      - lab-web-state:/var/lib/vertep-lab
      - ${LAB_CA_DIR:-./ca}:/run/lab-ca:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/lab/status', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks: [lab-web]

  lab-executor:
    build:
      context: ../..
      dockerfile: deploy/lab/Dockerfile
    image: ghcr.io/fylypovych/vertep-lab-control:${VERSION:-dev}
    command: ["uvicorn", "lab.role_service:create_app", "--factory", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      LAB_RESOURCE_URL: ${LAB_RESOURCE_URL:-}
      LAB_RESOURCE_TOKEN: ${LAB_RESOURCE_TOKEN:-}
      LAB_RESOURCE_CA_FILE: ${LAB_RESOURCE_CA_FILE:-}
      LAB_ROLE_EXECUTOR_TOKEN: ${LAB_ROLE_EXECUTOR_TOKEN:-}
    volumes:
      - lab-web-state:/var/lib/vertep-lab:ro
      - ${LAB_CA_DIR:-./ca}:/run/lab-ca:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      lab-control:
        condition: service_healthy
    restart: unless-stopped
    networks: [lab-web]

  lab-web:
    build:
      context: ../..
      dockerfile: deploy/lab/Dockerfile.web
    image: ghcr.io/fylypovych/vertep-lab-web:${VERSION:-dev}
    ports:
      - "127.0.0.1:${LAB_WEB_PORT:-8444}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      lab-control:
        condition: service_healthy
    restart: unless-stopped
    networks: [lab-web]

volumes:
  lab-web-state:

networks:
  lab-web:
