name: vertep-lab-web

# Standalone frontend/API packaging; no production CORE or GPU dependency.
# The runtime file runs images only: bootstrap-lab.sh takes it from the signed LAB
# package and pins LAB_CONTROL_IMAGE / LAB_WEB_IMAGE by digest (#491 L5). Building
# from a checkout adds docker-compose.web.build.yml (development only).
# Only the HTTPS panel is published, on the VM address (LAB_WEB_BIND, #491 L2/L8).
services:
  lab-control:
    image: ${LAB_CONTROL_IMAGE:-ghcr.io/fylypovych/vertep-lab-control:dev}
    command: ["uvicorn", "lab.api:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      LAB_STATE_DIR: /var/lib/vertep-lab
      LAB_WORKSPACE: /var/lib/vertep-lab/workspace
      LAB_POLICY_GATE_ACTIVE: "true"
      LAB_IDLE_SHARING_ENABLED: ${LAB_IDLE_SHARING_ENABLED:-false}
      LAB_RESOURCE_URL: ${LAB_RESOURCE_URL:-}
      LAB_RESOURCE_TOKEN: ${LAB_RESOURCE_TOKEN:-}
      LAB_OWNER_TOKEN: ${LAB_OWNER_TOKEN:-}
      LAB_OWNER_IDENTITY: ${LAB_OWNER_IDENTITY:-owner}
      LAB_GITHUB_TOKEN: ${LAB_GITHUB_TOKEN:-}
      LAB_GITHUB_REPOSITORY: ${LAB_GITHUB_REPOSITORY:-}
      LAB_ROLE_EXECUTOR_URL: ${LAB_ROLE_EXECUTOR_URL:-}
      LAB_ROLE_EXECUTOR_ENABLED: ${LAB_ROLE_EXECUTOR_ENABLED:-false}
      LAB_ROLE_EXECUTOR_TOKEN: ${LAB_ROLE_EXECUTOR_TOKEN:-}
      LAB_ROLE_EXECUTOR_TIMEOUT_SECONDS: "600"
      LAB_RESOURCE_CA_FILE: ${LAB_RESOURCE_CA_FILE:-}
      LAB_VERTEP_URL: ${LAB_VERTEP_URL:-}
    volumes:
      - lab-web-state:/var/lib/vertep-lab
      - ${LAB_CA_DIR:-./ca}:/run/lab-ca:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/lab/healthz', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks: [lab-web]

  lab-executor:
    image: ${LAB_CONTROL_IMAGE:-ghcr.io/fylypovych/vertep-lab-control:dev}
    command: ["uvicorn", "lab.role_service:create_app", "--factory", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      LAB_RESOURCE_URL: ${LAB_RESOURCE_URL:-}
      LAB_RESOURCE_TOKEN: ${LAB_RESOURCE_TOKEN:-}
      LAB_RESOURCE_CA_FILE: ${LAB_RESOURCE_CA_FILE:-}
      LAB_ROLE_EXECUTOR_TOKEN: ${LAB_ROLE_EXECUTOR_TOKEN:-}
    volumes:
      - lab-web-state:/var/lib/vertep-lab:ro
      - ${LAB_CA_DIR:-./ca}:/run/lab-ca:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      lab-control:
        condition: service_healthy
    restart: unless-stopped
    networks: [lab-web]

  # #546: model evaluations run only here, on demand, never in the API or the executor:
  # bubblewrap needs its own user/network namespaces, which Docker's default seccomp and
  # AppArmor profiles forbid. This container gets no secrets and no LAB state (its own
  # volume), publishes nothing and starts only when asked:
  #   docker compose -f docker-compose.web.yml --profile eval run --rm lab-eval eval lm-eval --endpoint http://<ollama>:11434
  lab-eval:
    image: ${LAB_EVAL_IMAGE:-ghcr.io/fylypovych/vertep-lab-eval:dev}
    profiles: ["eval"]
    entrypoint: ["python", "-m", "lab.cli"]
    command: ["eval", "list"]
    environment:
      LAB_STATE_DIR: /var/lib/vertep-lab-eval
      LAB_WORKSPACE: /var/lib/vertep-lab-eval/workspace
      LAB_POLICY_GATE_ACTIVE: "true"
      LAB_OLLAMA_URL: ${LAB_OLLAMA_URL:-}
    volumes:
      - lab-eval-state:/var/lib/vertep-lab-eval
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true", "seccomp=unconfined", "apparmor=unconfined"]
    restart: "no"
    networks: [lab-web]

  lab-web:
    image: ${LAB_WEB_IMAGE:-ghcr.io/fylypovych/vertep-lab-web:dev}
    environment:
      LAB_VERTEP_URL: ${LAB_VERTEP_URL:-}
    ports:
      - "${LAB_WEB_BIND:-0.0.0.0}:${LAB_WEB_PORT:-8444}:8443"
    volumes:
      # lab.crt / lab.key: the operator's own or the self-signed pair bootstrap-lab.sh makes.
      - ${LAB_TLS_DIR:-./tls}:/run/lab-tls:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      lab-control:
        condition: service_healthy
    restart: unless-stopped
    networks: [lab-web]

volumes:
  lab-web-state:
  lab-eval-state:

networks:
  lab-web:
