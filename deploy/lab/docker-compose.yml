name: vertep-lab

# ===========================================================================
# Autonomous laboratory for Vertep (Issue #107 / var.0.0.1.7).
#
# This stack runs on a separate, isolated Ubuntu VM.  It never mounts the
# production Docker socket, never touches production volumes, secrets or
# databases, and never publishes a fleet-reachable port.  The only way it can
# use the production GPU is through the narrow idle-lease contract handled by
# the ``lab-control`` service; idle sharing is off by default and must be
# explicitly enabled by the owner after the real-GPU guarantees are proven.
# ===========================================================================

services:
  lab-control:
    build:
      context: ../..
      dockerfile: deploy/lab/Dockerfile
    image: ghcr.io/fylypovych/vertep-lab-control:${VERSION:-dev}
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - lab-state:/var/lib/vertep-lab
      - lab-repo:/srv/vertep-lab/repo:ro
    environment:
      - LAB_POLICY_GATE_ACTIVE=true
      - LAB_IDLE_SHARING_ENABLED=${LAB_IDLE_SHARING_ENABLED:-false}
      - LAB_VERTEP_URL=${LAB_VERTEP_URL:-}
      - LAB_RESOURCE_URL=${LAB_RESOURCE_URL:-}
      - LAB_RESOURCE_TOKEN=${LAB_RESOURCE_TOKEN:-}
      # Owner acts (grant/revoke) and publication need the owner secret; without
      # them the laboratory stays fail-closed and the transport stays dry-run.
      - LAB_OWNER_TOKEN=${LAB_OWNER_TOKEN:-}
      - LAB_OWNER_IDENTITY=${LAB_OWNER_IDENTITY:-owner}
      - LAB_GITHUB_TOKEN=${LAB_GITHUB_TOKEN:-}
      - LAB_GITHUB_REPOSITORY=${LAB_GITHUB_REPOSITORY:-}
      - LAB_GITHUB_API_URL=${LAB_GITHUB_API_URL:-}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,json; d=json.load(urllib.request.urlopen('http://localhost:8000/api/lab/healthz', timeout=5)); raise SystemExit(0 if d.get('policy_activated') else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks: [lab-net]

  # #546: model evaluations (bubblewrap namespaces) run only here, on demand; no secrets,
  # no LAB state, no ports. Default seccomp/AppArmor forbid those namespaces, so only this
  # container runs without them:
  #   docker compose --profile eval run --rm lab-eval eval lm-eval --endpoint http://<ollama>:11434
  lab-eval:
    build:
      context: ../..
      dockerfile: deploy/lab/Dockerfile.eval
    image: ghcr.io/fylypovych/vertep-lab-eval:${VERSION:-dev}
    profiles: ["eval"]
    entrypoint: ["python", "-m", "lab.cli"]
    command: ["eval", "list"]
    environment:
      - LAB_STATE_DIR=/var/lib/vertep-lab-eval
      - LAB_WORKSPACE=/var/lib/vertep-lab-eval/workspace
      - LAB_POLICY_GATE_ACTIVE=true
      - LAB_OLLAMA_URL=${LAB_OLLAMA_URL:-}
    volumes:
      - lab-eval-state:/var/lib/vertep-lab-eval
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
      - apparmor=unconfined
    restart: "no"
    networks: [lab-net]

  lab-sandbox:
    build:
      context: ../..
      dockerfile: deploy/lab/Dockerfile.sandbox
    image: ghcr.io/fylypovych/vertep-lab-sandbox:${VERSION:-dev}
    command: ["python", "-m", "lab.cli", "run"]
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - lab-state:/var/lib/vertep-lab:ro
      - lab-repo:/srv/vertep-lab/repo:ro
    environment:
      - LAB_IDLE_SHARING_ENABLED=${LAB_IDLE_SHARING_ENABLED:-false}
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
          pids: 64
    restart: "no"
    network_mode: none

volumes:
  lab-state:
  lab-eval-state:
  lab-repo:

networks:
  lab-net:
    driver: bridge
