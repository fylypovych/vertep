name: vertep-lab

# ===========================================================================
# Autonomous laboratory for Vertep (Issue #107 / var.0.0.1.7).
#
# This stack runs on a separate, isolated Ubuntu VM.  It never mounts the
# production Docker socket, never touches production volumes, secrets or
# databases, and never publishes a fleet-reachable port.  The only way it can
# use the production GPU is through the narrow idle-lease contract handled by
# the ``lab-control`` service; idle sharing is off by default and must be
# explicitly enabled by the owner after the real-GPU guarantees are proven.
# ===========================================================================

services:
  lab-control:
    build:
      context: .
      dockerfile: deploy/lab/Dockerfile
    image: ghcr.io/fylypovych/vertep-lab-control:${VERSION:-dev}
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - lab-state:/var/lib/vertep-lab
      - lab-repo:/srv/vertep-lab/repo:ro
    environment:
      - LAB_POLICY_GATE_ACTIVE=true
      - LAB_IDLE_SHARING_ENABLED=${LAB_IDLE_SHARING_ENABLED:-false}
      - LAB_VERTEP_URL=${LAB_VERTEP_URL:-}
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,json; d=json.load(urllib.request.urlopen('http://localhost:8000/api/lab/status', timeout=5)); raise SystemExit(0 if d.get('policy',{}).get('activated') else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks: [lab-net]

  lab-sandbox:
    build:
      context: .
      dockerfile: deploy/lab/Dockerfile.sandbox
    image: ghcr.io/fylypovych/vertep-lab-sandbox:${VERSION:-dev}
    command: ["python", "-m", "lab.cli", "run"]
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - lab-state:/var/lib/vertep-lab
      - lab-repo:/srv/vertep-lab/repo:ro
    environment:
      - LAB_IDLE_SHARING_ENABLED=${LAB_IDLE_SHARING_ENABLED:-false}
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
    restart: "no"
    networks: [lab-net]

volumes:
  lab-state:
  lab-repo:

networks:
  lab-net:
    driver: bridge
