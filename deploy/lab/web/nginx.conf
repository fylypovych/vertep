worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;

    server {
        listen 8080;
        root /srv/lab-web;
        index index.html;
        add_header X-Content-Type-Options nosniff always;

        # Docker DNS is resolved on requests, so an API restart does not require
        # restarting the frontend. Authentication is passed through unchanged.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $lab_api http://lab-control:8000;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /readyz {
            access_log off;
            default_type text/plain;
            if (-f /srv/lab-web/index.html) {
                return 200 "ok\n";
            }
            return 503 "Збірка frontend лабораторії відсутня.\n";
        }

        location ^~ /api/lab/ {
            proxy_pass $lab_api$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Unknown API paths must not return the Angular index page.
        location = /api {
            return 404;
        }
        location /api/ {
            return 404;
        }

        location = /index.html {
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =503;
        }

        location ~* \.(?:js|css|map|json|ico|png|jpg|jpeg|svg|webp|woff2?)$ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
